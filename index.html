Q169)"},{"q":"An organisation sets numeric quality goals and uses measurements to control its processes. Which level is this?","o":["Level 2: Repeatable","Level 3: Defined","Level 4: Managed","Level 1: Initial"],"a":2,"e":"Level 4 is about quantitative control of process and quality.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"What is the focus of Level 5 (Optimizing)?","o":["Continuous improvement, defect prevention and technology innovation","Basic project tracking","Writing the first documented process","Hiring heroic individuals"],"a":0,"e":"At Level 5 the organisation keeps improving its process proactively.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"Can an organisation jump straight from Level 1 to Level 4?","o":["Yes, if it buys the right tools","Yes, if senior management orders it","No, because each level builds on the practices of the level below","No, because Level 4 is reserved for certified defence contractors only"],"a":2,"e":"Level 1 is every organisation's starting point, and the levels are climbed like a staircase.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"A team claims its requirements practice is at Level 2. Which evidence supports the claim best?","o":["A team member says the project felt organised","A requirements register with IDs, a recorded baseline and a log of approved changes","A plan to start documenting requirements next year","One project that succeeded through overtime"],"a":1,"e":"A maturity claim needs evidence that the practice is actually performed, such as managed and controlled requirements.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"CMM describes an evolution from:","o":["Ad-hoc chaos to a disciplined, predictable and continuously improving culture","Manual testing to automated testing","Small teams to large teams","Desktop software to cloud software"],"a":0,"e":"Maturity means the process becomes more disciplined and predictable at each level.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"What is a Key Process Area (KPA)?","o":["A department that owns the testing budget","A grouped set of activities that must be achieved to satisfy a maturity level","A list of the organisation's best programmers","A stage of the waterfall model"],"a":1,"e":"Each level above 1 is reached by satisfying its key process areas.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"Which maturity level has no key process areas?","o":["Level 1","Level 2","Level 3","Level 5"],"a":0,"e":"Level 1 is simply the starting point, so nothing has to be achieved to be there.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"Requirements Management is a key process area of which level?","o":["Level 2: Repeatable","Level 3: Defined","Level 4: Managed","Level 5: Optimizing"],"a":0,"e":"Requirements engineering is anchored at Level 2 under Requirements Management.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"Which set lists Level 2 key process areas?","o":["Defect Prevention, Technology Change Management, Process Change Management","Process Definition, Process Focus, Training Program, Peer Reviews","Requirements Management, Project Planning, Project Monitoring and Control, Configuration Management","Quantitative Process Management, Software Quality Management"],"a":2,"e":"Level 2 focuses on basic project management; A is Level 5, B is Level 3 and D is Level 4.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"Peer Reviews and the Training Program belong to which level?","o":["Level 2: Repeatable","Level 4: Managed","Level 5: Optimizing","Level 3: Defined"],"a":3,"e":"Level 3 covers Process Definition, Process Focus, Training Program and Peer Reviews.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"Which key process areas belong to Level 4 (Managed)?","o":["Quantitative Process Management and Software Quality Management","Project Planning and Configuration Management","Defect Prevention, Technology Change Management and Process Change Management","Process Definition and Peer Reviews"],"a":0,"e":"Level 4 is about quantitative control, so both of its areas concern measurement.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"Defect Prevention is a key process area of:","o":["Level 3: Defined","Level 5: Optimizing","Level 2: Repeatable","Level 4: Managed"],"a":1,"e":"Level 5 covers Defect Prevention, Technology Change Management and Process Change Management.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"What is the focus of Level 2 as a whole?","o":["Basic project management","Organisation-wide standards","Quantitative control","Continuous improvement"],"a":0,"e":"The other three are the focus of Levels 3, 4 and 5 in that order.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"What is the purpose of Requirements Management (REQM) in CMM?","o":["To write code directly from user interviews","To build a common, controlled understanding of the requirements between the customer and the project team","To remove the customer from requirement decisions","To measure defect density statistically"],"a":1,"e":"REQM makes sure both sides share one agreed and controlled set of requirements.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"Which of these is one of the three REQM goals?","o":["Train every employee in the standard process","Set quantitative quality goals for each product","Introduce new technology and tools across the whole organisation every year","Keep plans, work products and activities consistent with the requirements"],"a":3,"e":"The three goals are: baseline the requirements, stay consistent with them, and control changes to them.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"In REQM, system requirements are allocated to software components and then baselined. What does “baselined” mean?","o":["An agreed version is fixed as the reference, and later changes go through formal control","The requirements are deleted after coding","The requirements are ranked from lowest to highest priority","The requirements are kept secret from the customer"],"a":0,"e":"A baseline is the approved reference point against which changes are managed.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"Through which key process area does REQM manage requirement changes in a disciplined way?","o":["Peer Reviews","Defect Prevention","Training Program","Configuration Management"],"a":3,"e":"Configuration Management controls versions and changes to baselined items.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"A requirement changes, but the project plan and test cases are never updated. Which REQM goal is violated?","o":["Keeping plans, work products and activities consistent with the requirements","Allocating requirements to hardware suppliers","Achieving defect prevention","Setting quantitative quality goals"],"a":0,"e":"When requirements change, everything derived from them must change too.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"Which is a limitation of CMM rather than a benefit?","o":["Predictable schedules and costs","Higher product quality","Systematic risk reduction","Heavy documentation overhead"],"a":3,"e":"The limitations are high implementation cost and time, heavy documentation and resistance to organisational change.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"What is CMMI?","o":["A cheaper copy of CMM with only two levels","The successor that replaced and expanded CMM to cover broader engineering and service domains","A programming standard for military software","A testing tool created by the SEI"],"a":1,"e":"Capability Maturity Model Integration keeps the maturity-level idea but applies it well beyond software.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"A team must choose which process improvement to do first. Which is the best choice?","o":["The action with the highest effort and the lowest expected impact on the process","The action with high impact for low effort, with a metric to prove it worked","The action that needs no measurement","The action that is easiest to describe on a slide"],"a":1,"e":"Improvements are prioritised by effort against impact, and a metric shows whether the change actually helped.","w":4,"t":"Key process areas, REQM, CMMI and improvement (Q170–Q185)"},{"q":"Requirements elicitation is best described as:","o":["Writing the full requirements document in a standard template","Testing the system against its requirements","Choosing the architecture of the system","Discovering requirements from stakeholders and other sources"],"a":3,"e":"Elicitation finds out what is needed; writing it down and checking it come later.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"Why is “gathering” a misleading word for elicitation?","o":["Because requirements are always written down already","Because requirements are not lying ready to collect; they must be drawn out, explored and clarified","Because only managers can state requirements","Because elicitation happens after coding"],"a":1,"e":"Stakeholders often hold needs they have never put into words, so the analyst has to discover them.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"Which of these is a source of requirements other than a person?","o":["A department manager","An end user","A project sponsor","The forms and reports used in the current manual process"],"a":3,"e":"Documents, existing systems, regulations and domain knowledge are sources alongside stakeholders.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"A team is replacing a legacy payroll system whose original users have left the company. Which source is most valuable?","o":["A brainstorming session with the developers","A survey of the general public","A competitor's marketing brochure","The existing system and its documentation"],"a":3,"e":"When people are unavailable, the current system and its documents hold the rules it implements.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"Which technique suits collecting opinions from 2,000 students spread across several campuses?","o":["One-to-one interviews with each student","Observation of every student for a day","A questionnaire or survey","A single brainstorming meeting"],"a":2,"e":"Questionnaires reach many people in many places at low cost.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"Warehouse staff say they cannot explain how they decide where to store items; they “just know”. Which technique fits best?","o":["A questionnaire with closed questions","Reading the company's annual report","An email asking for a written description","Observation of the staff at work"],"a":3,"e":"Tacit knowledge cannot be explained on request, but it can be seen in action.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"What is the main strength of observation (ethnography)?","o":["It reveals how work is actually done, including tacit knowledge people do not mention","It reaches thousands of people cheaply","It needs no time from the analyst","It produces statistically precise data"],"a":0,"e":"Watching real work exposes the gap between the official process and what people actually do.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"Stakeholders say, “We will know what we want when we see it.” Which technique fits best?","o":["Document analysis","A postal questionnaire","Reading the regulations","Prototyping"],"a":3,"e":"A prototype gives stakeholders something concrete to react to.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"What is the main purpose of a requirements workshop (such as JAD)?","o":["To let one stakeholder dictate all the requirements","To replace all written documentation","To bring key stakeholders together so that needs are agreed and differences resolved quickly","To test the finished system with users"],"a":2,"e":"A workshop puts the decision-makers in one room, which shortens the cycle of separate interviews.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"What is the basic rule of a brainstorming session?","o":["Each idea must be costed before it is spoken","Generate many ideas first, without criticising them, and evaluate later","Only the most senior person may suggest ideas","Ideas must be submitted in writing to the session chair a full week earlier"],"a":1,"e":"Separating idea generation from evaluation keeps people contributing freely.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"When is document analysis most useful?","o":["When existing forms, manuals and reports describe the current process and data","When no documents exist in the organisation","When the system is entirely new to the world","When stakeholders want to see a working screen"],"a":0,"e":"Existing documents show the data, rules and steps the new system must still support.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"What is a weakness of questionnaires?","o":["They cannot reach many people","They are very expensive per respondent","They always take months to analyse","There is little chance to ask follow-up questions or clarify answers"],"a":3,"e":"A questionnaire is one-way, so unclear answers cannot be explored on the spot.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"A technique plan lists, for each source, the technique, why it was chosen and what the team expects to learn. Why is the “why” column important?","o":["It makes the plan look longer","It names the person who approved the plan","It records the time of each meeting","It shows the technique was matched to the source, not picked by habit"],"a":3,"e":"The right technique depends on who or what the source is and the kind of knowledge it holds.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"Why should a team combine several elicitation techniques?","o":["To increase the cost of the project","Each technique has blind spots, so combining them gives a fuller and cross-checked picture","Because using one technique is forbidden by standards","To avoid meeting stakeholders in person"],"a":1,"e":"What an interview misses, observation or document analysis may reveal, and each can confirm the others.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"A senior executive has 30 minutes and holds key knowledge about business goals. Which technique is most suitable?","o":["A week of observation","A 200-question survey","A focused interview","A brainstorming session with 20 people"],"a":2,"e":"An interview gets depth from one key person in limited time.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"Which source would best reveal the legal requirements for a payment system?","o":["The regulations and standards that govern payments","The developers' personal preferences about payment tools","A brainstorming session with interns","The company's colour guidelines"],"a":0,"e":"Legal and domain requirements come from the rules themselves and from the experts who apply them.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"The “what we expect to learn” column of a technique plan mainly helps the team to:","o":["Decide the salary of the interviewer","Avoid talking to stakeholders","Prepare focused questions and judge afterwards whether the session succeeded","Replace the requirements specification"],"a":2,"e":"Stating the goal of each session keeps it purposeful and makes gaps visible afterwards.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"What is a risk of relying on prototypes during elicitation?","o":["Stakeholders cannot give feedback on a prototype","Stakeholders may mistake the prototype for the finished system and focus on screen details","Prototypes cannot show user interfaces","Prototypes make every requirement more ambiguous"],"a":1,"e":"Expectations must be managed: a prototype is a learning tool, not the product.","w":5,"t":"Requirement sources and elicitation techniques (Q186–Q203)"},{"q":"Stakeholders often cannot say exactly what they want from a new system. Which elicitation problem is this?","o":["Requirements volatility","Stakeholders do not know what they really want","Conflicting requirements","Political factors"],"a":1,"e":"People usually know their problems better than the solution, so needs come out vague or unrealistic.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"A nurse describes her needs using ward jargon the analyst does not understand. Which elicitation problem is this?","o":["Stakeholders express requirements in their own terms, with implicit domain knowledge","Stakeholders refuse to take part","Requirements change too quickly","The analyst has too many techniques to choose from"],"a":0,"e":"Stakeholders speak the language of their work and assume the analyst shares their background.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"What is the best way to handle the jargon problem?","o":["Build a shared glossary and ask stakeholders to explain or demonstrate terms","Replace the stakeholders with developers","Ignore terms that are not understood","Guess the meaning and confirm it after delivery"],"a":0,"e":"A glossary and clarifying questions turn implicit domain knowledge into shared understanding.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"A manager pushes for a feature mainly to increase his department's control. Which elicitation problem is this?","o":["Tacit knowledge","Organisational and political factors influencing requirements","Poor interview technique","Lack of documents"],"a":1,"e":"Some requests serve power or status more than a real system need, and the analyst must recognise them.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"During a six-month analysis, a new regulation changes what the system must do. Which problem is this?","o":["Stakeholders using jargon","Stakeholders not knowing what they want","A badly structured interview","Requirements changing during analysis because the environment is dynamic"],"a":3,"e":"The business and legal environment keeps moving, so requirements can change while they are being elicited.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"Different stakeholder groups ask for things that cannot all be delivered together. What should the analyst do?","o":["Record only the requests of the most senior group","Surface the conflicts and resolve them through negotiation","Implement every request exactly as stated","Stop the elicitation until the stakeholders agree by themselves"],"a":1,"e":"Conflicting requirements are a normal elicitation problem, and negotiation is the way to resolve them.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"Which is an open question?","o":["“Do you print the invoice?”","“How do you handle a returned item, from start to finish?”","“Is the sales report produced weekly or monthly at present?”","“Does the system need a login?”"],"a":1,"e":"It invites a free, detailed answer; the others can be answered in a word.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"Which is a closed question?","o":["“What frustrates you about the current process?”","“How do you decide which orders to ship first?”","“How many orders do you process per day?”","“Why is the monthly report important to you?”"],"a":2,"e":"It asks for one specific fact.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"When are open questions most useful in an interview?","o":["Early on, to explore the stakeholder's work and uncover needs the analyst did not anticipate","Only at the very end, to confirm a number","Never, because they waste time","Only when the stakeholder is a developer"],"a":0,"e":"Open questions let stakeholders raise issues the analyst would not have known to ask about.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"When are closed questions most useful?","o":["To encourage long stories about the job","To explore unknown problem areas","To build rapport at the start","To confirm specific facts and details"],"a":3,"e":"Closed questions pin down numbers, options and yes/no facts.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"Which is a leading question that an interviewer should avoid?","o":["“How do you currently approve leave requests from staff?”","“What happens when an approval is late?”","“You would prefer automatic approval, wouldn't you?”","“Who else is involved in the approval?”"],"a":2,"e":"It suggests the answer the interviewer wants, which biases the requirement.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"Why does a good interview plan mix open and closed questions?","o":["Closed questions are forbidden in the first half","Open questions are easier to count","Open questions discover needs and closed questions pin down the details","Mixing them makes the interview much longer, which impresses stakeholders"],"a":2,"e":"Exploring first and confirming afterwards gives both breadth and precision.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"What is the difference between a closed (structured) interview and an open (unstructured) interview?","o":["A closed interview is held in a locked room","An open interview has no stakeholder present","A closed interview is recorded; an open one is not","A closed interview follows a predefined set of questions; an open one explores issues without a fixed agenda"],"a":3,"e":"In practice most interviews combine the two.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"A team expects that stakeholders will be too busy to attend sessions. Which is the best way to handle this expected problem?","o":["Cancel elicitation and write the requirements themselves","Book short sessions in advance and prepare focused questions, with a questionnaire as backup","Wait until the stakeholders complain","Interview only the developers instead"],"a":1,"e":"Anticipated problems are handled by planning around them, not by dropping the stakeholders.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"What is a limitation of interviews as an elicitation technique?","o":["They cannot be used with managers","They produce only numerical data","People describe what they think they do, which can differ from what they actually do","They require a working prototype"],"a":2,"e":"Interviews miss tacit knowledge and real practice, which is why they are combined with observation.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"At the end of an interview, the analyst summarises what was heard and asks the stakeholder to confirm it. Why?","o":["To catch misunderstandings before they become wrong requirements","To make the stakeholder sign a contract","To fill the remaining time","To avoid writing notes"],"a":0,"e":"Confirming the summary is a quick check of what was understood.","w":5,"t":"Elicitation problems and interviews (Q204–Q219)"},{"q":"What is the scribe's main job in an elicitation session?","o":["To lead the questioning","To record what stakeholders say accurately, including decisions and open questions","To argue against stakeholder requests","To design the user interface during the meeting"],"a":1,"e":"The scribe produces the record from which requirements are later written.","w":5,"t":"Scribe notes and scenarios (Q220–Q230)"},{"q":"Why is it useful to have a scribe separate from the interviewer?","o":["The interviewer can listen and follow up while nothing said is lost","Two people make the stakeholder feel outnumbered","The scribe can answer questions on behalf of the stakeholder when needed","Notes are no longer needed"],"a":0,"e":"Splitting the roles lets one person concentrate on the conversation and the other on capturing it.","w":5,"t":"Scribe notes and scenarios (Q220–Q230)"},{"q":"A stakeholder says, “Refunds over Rs 10,000 always need my approval.” How should the scribe capture this?","o":["As a joke that need not be recorded","As a discovered requirement, noting who said it","As a design decision for the developers' database schema","As a defect in the interview"],"a":1,"e":"It is a business rule the system must enforce, and its source should be recorded.","w":5,"t":"Scribe notes and scenarios (Q220–Q230)"},{"q":"In scribe notes, why keep what the stakeholder said separate from the team's own assumptions?","o":["To make the notes shorter","Because assumptions are always wrong","Because stakeholders are not allowed to read the notes taken in a session","So unverified assumptions are not mistaken for stated requirements"],"a":3,"e":"Assumptions must be checked with the stakeholder before they are treated as requirements.","w":5,"t":"Scribe notes and scenarios (Q220–Q230)"},{"q":"What is a scenario in requirements elicitation?","o":["A concrete, step-by-step description of how the system is used in a real situation","A list of the project's risks","A table of stakeholder influence","A diagram of database tables"],"a":0,"e":"A scenario tells the story of one interaction with the system.","w":5,"t":"Scribe notes and scenarios (Q220–Q230)"},{"q":"Which set lists the parts of a well-formed scenario?","o":["Budget, schedule, team and tools","Role, goal and benefit","Given, when and then","Starting situation, normal flow, exceptions and end state"],"a":3,"e":"A scenario says where things start, what normally happens, what can go wrong and how things end.","w":5,"t":"Scribe notes and scenarios (Q220–Q230)"},{"q":"In a scenario for withdrawing cash, “the card is retained after three wrong PIN entries” belongs to which part?","o":["Starting situation","Normal flow","End state of the normal flow","Exception"],"a":3,"e":"It describes what happens when something goes wrong.","w":5,"t":"Scribe notes and scenarios (Q220–Q230)"},{"q":"In a scenario for borrowing a library book, “the member is logged in and the book is available” describes the:","o":["Starting situation","Exception","End state","Normal flow"],"a":0,"e":"It states what is true before the interaction begins.","w":5,"t":"Scribe notes and scenarios (Q220–Q230)"},{"q":"Why do scenarios include exceptions?","o":["To make the scenario longer","To describe the user interface colours","To replace the normal flow","Things that go wrong reveal requirements that the normal flow never mentions"],"a":3,"e":"Error handling is a common area of missing requirements, and exceptions bring it out.","w":5,"t":"Scribe notes and scenarios (Q220–Q230)"},{"q":"Why do stakeholders often find scenarios easier than abstract requirement statements?","o":["Scenarios contain no details","Scenarios are written in code","People relate more easily to concrete examples of real use","Scenarios never change"],"a":2,"e":"A real-life example is easier to comment on and correct than an abstract statement.","w":5,"t":"Scribe notes and scenarios (Q220–Q230)"},{"q":"What does the “end state” of a scenario describe?","o":["The cost of building the feature","The condition of the system and user when the scenario finishes","The first screen the user sees","The list of stakeholders interviewed"],"a":1,"e":"For example: the book is on loan to the member and the stock count is reduced by one.","w":5,"t":"Scribe notes and scenarios (Q220–Q230)"},{"q":"What does requirements analysis do?","o":["Collects raw needs from stakeholders for the first time","Writes the final contract with the customer","Tests the finished system against its specification","Examines gathered requirements for meaning, dependencies, conflicts and feasibility"],"a":3,"e":"Analysis studies what has been gathered and how the requirements interact.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"After examining the requirements, analysis also checks that they:","o":["Satisfy stakeholder needs","Are written in the developers' preferred language","Fit on a single page","Have been approved by the testers"],"a":0,"e":"The requirements must make sense together and still meet what stakeholders need.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"Teachers want to edit marks after submission; the examination department wants marks locked after submission. Each request is reasonable. What does analysis reveal?","o":["One of the two departments is acting in bad faith towards the other","The requirements cannot be implemented together as written","The requirements are duplicates of each other","Neither requirement is feasible"],"a":1,"e":"Each is sensible from its own department's view, but together they conflict.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"Faced with reasonable but conflicting requirements, what is the analyst's job?","o":["To pick the request made by the most senior stakeholder involved","To implement whichever requirement is cheapest","To understand the underlying needs, not simply pick a winner","To delete both requirements"],"a":2,"e":"The needs behind the requests are what a good solution has to satisfy.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"How do analysis and negotiation relate?","o":["Negotiation finds conflicts; analysis resolves them","Analysis surfaces the conflict; negotiation resolves it","They are two names for the same activity","Negotiation is done before any requirement has been gathered"],"a":1,"e":"Analysis detects the problem and negotiation settles it with the stakeholders.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"What is requirements negotiation?","o":["Developers deciding the requirements among themselves","The customer bargaining over the project price","Testers choosing which defects to fix","Stakeholders discussing conflicting needs, comparing alternatives and agreeing on a balanced set of requirements"],"a":3,"e":"The outcome is a balanced set of requirements that the stakeholders accept.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"Why is negotiation needed at all?","o":["Because stakeholders enjoy long meetings","Because budget, time and technical resources are limited, so not every wish can be met","Because requirements are always written incorrectly","Because the law requires a negotiation meeting"],"a":1,"e":"Limited resources force choices, and stakeholders compete for priority.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"Which of these is something a good negotiation does?","o":["Hides the trade-offs from stakeholders","Accepts every request so that nobody is disappointed","Separates essentials from preferences","Lets the loudest stakeholder decide"],"a":2,"e":"The six practices: find the real reason, let stakeholders explain, separate essentials from preferences, explore alternatives, weigh the factors, record the decision.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"A good negotiation weighs alternatives against which factors?","o":["The seniority, age and job title of each stakeholder","The number of words in each requirement","Cost, risk, feasibility and business impact","The order in which requests were received"],"a":2,"e":"Decisions rest on evidence about cost, risk, feasibility and business impact.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"In the exam-system example, teachers ask to “edit marks after submission”. What is their underlying concern?","o":["Correcting data-entry mistakes","Preventing unauthorised changes","Publishing results on time","Keeping a complete record of changes"],"a":0,"e":"Teachers want a way to fix honest errors.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"The examination department asks to “lock marks after submission”. What is its underlying concern?","o":["Avoiding delays in publishing results","Correcting data-entry mistakes","Preventing unauthorised changes","Reducing the teachers' workload"],"a":2,"e":"Locking is the department's way of protecting the marks.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"Quality assurance asks to “keep a complete record of changes”. What is its underlying concern?","o":["Faster data entry","Lower storage cost","Easier login for teachers","Accountability"],"a":3,"e":"A full change record shows who changed what and why.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"Why does negotiation work with the underlying concern and not only the stated request?","o":["Because stated requests are always false","Because concerns are easier to code","Because concerns can often be satisfied together even when the stated requests cannot","Because stakeholders forget what they requested"],"a":2,"e":"“Edit” and “lock” clash, but “fix mistakes” and “prevent unauthorised changes” can both be met.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"Which is a weak solution to the marks conflict?","o":["Corrections allowed before final approval, with every change logged","Changes after approval only with authorisation from the examination department","Simply rejecting the teachers' request, or allowing unrestricted editing","An audit trail recording old value, new value, user, time and reason"],"a":2,"e":"Both extremes ignore one side's legitimate concern.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"In the balanced solution, when may teachers correct marks freely?","o":["At any time, without limits","Before final approval","Only after the results are published","Never"],"a":1,"e":"After approval, a change needs authorisation from the examination department.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"In the balanced solution, what does every change to marks record?","o":["Only the new value","The old value, new value, user, timestamp and reason","Only the name of the teacher who made the latest change","Only the date of the change"],"a":1,"e":"These five items make every change auditable.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"What is the teaching point of the balanced solution?","o":["Negotiation does not mean giving everyone everything; it protects the most important needs and makes trade-offs explicit","Negotiation means the examination department always wins","Negotiation means every request is implemented in full","Negotiation means removing security to keep users happy"],"a":0,"e":"Teachers get their corrections while security, accountability and control are preserved.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"During analysis, a requirement is found to be ambiguous. What should the analyst record with the finding?","o":["The problem type and a specific question for the stakeholder who can clarify it","The analyst's own guess, written as the new requirement","The name of the developer who will code it","Nothing, because ambiguity always resolves itself later during design and coding"],"a":0,"e":"A finding is closed by asking the right stakeholder, then rewriting the requirement from the answer.","w":6,"t":"Requirements analysis and negotiation (Q231–Q248)"},{"q":"What is an interaction matrix used for?","o":["Estimating the cost and effort of each requirement in person-days","Comparing requirements pairwise to see how they behave together","Assigning requirements to developers","Scheduling stakeholder interviews"],"a":1,"e":"Every requirement is checked against every other to find conflicts, dependencies, overlaps and complements.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"In an interaction matrix, what does “C” mean?","o":["Conflict: both requirements cannot be satisfied as written","Complete: the requirement is fully specified and already approved","Critical: the requirement has top priority","Change: the requirement was recently edited"],"a":0,"e":"C marks a pair that cannot both hold as currently worded.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"What does “D” mean in the matrix?","o":["Duplicate","Deleted","Dependency: one requirement relies on another","Deferred: the requirement moves to a later release"],"a":2,"e":"D marks a pair where one requirement needs the other.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"What does “S” mean in the matrix?","o":["Supports: the requirements complement each other","Security requirement","Stakeholder-approved","Same: the identical requirement has been stated twice"],"a":0,"e":"S marks a pair that strengthen each other.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"What does “O” mean in the matrix?","o":["Optional requirement","Overlap: the same or similar functionality is requested twice","Open question for the stakeholder","Obsolete requirement"],"a":1,"e":"O marks a pair that ask for the same or similar thing.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"“Students can download a result only after it has been published.” How do “download result” and “publish result” interact?","o":["Dependency","Conflict","Overlap","No direct interaction"],"a":0,"e":"Downloading relies on publication having happened first.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"How do user authentication and audit logging interact?","o":["Conflict","Supports","Overlap","No direct interaction"],"a":1,"e":"They complement each other: knowing who the user is makes the audit log meaningful.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"Two requirements both ask for a “monthly attendance summary” in slightly different words. Which mark fits?","o":["C (conflict)","D (dependency)","O (overlap)","S (supports)"],"a":2,"e":"The same functionality has been requested twice and should be merged.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"The matrix flags a conflict between two requirements. How should the team treat it?","o":["As a final verdict that one requirement must be deleted","As a lead to investigate, not a verdict","As proof that the stakeholders are wrong","As a reason to stop the project"],"a":1,"e":"A suspected conflict must be investigated before anything is decided.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"Two requirements look contradictory. When might they still be compatible?","o":["When they were written by the same person on the same day","When both are marked as high priority","When they appear in different chapters","When they apply to different roles, conditions or times"],"a":3,"e":"An apparent contradiction can disappear once the scope of each requirement is made clear.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"Online exams: R1 allows access only at or after the scheduled start; R2 allows access at any time. How do R1 and R2 interact?","o":["Supports","Dependency","Overlap","Likely conflict"],"a":3,"e":"“At any time” permits the early access that R1 forbids.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"What is the right next step for the R1–R2 conflict?","o":["Delete R1 because it restricts students","Delete R2 because it is shorter","Clarify the intended access window with stakeholders","Implement both and let the testers decide which to keep"],"a":2,"e":"The team must find out what window was actually meant before choosing a resolution.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"R3 is automatic submission at the deadline, and R4 lets students save answers. Why is R3–R4 marked as a dependency?","o":["They ask for the same feature twice","They cannot both be built","They have nothing to do with each other","Auto-submit must handle saved answers, unsaved changes and the deadline"],"a":3,"e":"What is submitted automatically depends on how saving works.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"R5 says only authorised staff may change the exam schedule. How does R5 relate to R1 (access only from the scheduled start)?","o":["Conflict","Supports: controlled schedule changes help enforce the access rule","Overlap","No direct interaction"],"a":1,"e":"If anyone could change the schedule, the start-time rule would be easy to bypass.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"An interaction matrix is best understood as:","o":["A complete substitute for understanding the requirements","A replacement for stakeholder negotiation","A detection tool that points to pairs needing attention","A final list of approved requirements"],"a":2,"e":"The matrix finds candidate problems; people still have to understand and resolve them.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"A team has 5 requirements. How many distinct pairs must an interaction matrix compare?","o":["5","20","25","10"],"a":3,"e":"Each requirement is compared with every other once: 5 × 4 ÷ 2 = 10.","w":6,"t":"Interaction matrices (Q249–Q264)"},{"q":"Which sequence gives the five steps of the structured negotiation process?","o":["Document, agree, compare, understand, identify","Identify the conflict, agree on a resolution, understand the needs, compare alternatives, document the decision","Understand needs, identify the conflict, document, compare alternatives, agree","Identify the conflict, understand needs, compare alternatives, agree on a resolution, document the decision"],"a":3,"e":"Identify, understand, compare, agree, document.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"In “identify the conflict”, the team establishes:","o":["Who will pay for the change","Which developer or analyst originally caused the conflict","Which requirements disagree, and under what conditions","Which stakeholder is most senior"],"a":2,"e":"The first step pins down exactly what clashes and when.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"In “understand needs”, the team asks:","o":["Why each requirement matters and what problem it solves","How many lines of code each requirement needs to implement","Which requirement was written first","Who can be blamed for the conflict"],"a":0,"e":"The reasons behind the requirements are what the resolution must respect.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"When alternatives are compared, which factors are assessed?","o":["Security, usability, cost, deadlines, legal duties and feasibility","Font, colour, layout and logo","Only the cost of each alternative","Only the preference of senior management"],"a":0,"e":"Each alternative is judged on several factors, not on cost or rank alone.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"What does “agree on a resolution” involve?","o":["Postponing the decision until after release","Letting each stakeholder implement their own version of the requirement","Choosing a solution, setting conditions and naming who can approve it","Deleting all requirements involved in the conflict"],"a":2,"e":"An agreement needs a chosen solution, its conditions and an approver.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"Why is “document the decision” the step that makes an agreement traceable?","o":["It records the requirement, rationale, trade-offs, owners and approval status for later reference","It allows the team to forget the conflict","It replaces the requirements specification","It hides the trade-offs from stakeholders"],"a":0,"e":"A written record lets anyone later see what was agreed, why and by whom.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"Two managers settle a conflict verbally in a corridor, and nothing is written down. Has the negotiation ended properly?","o":["No: negotiation ends with a written, approved decision, not a verbal compromise","Yes: any agreement between managers is enough","Yes: written records are needed only for formal legal disputes with outside parties","No: only the developers can end a negotiation"],"a":0,"e":"Without a written, approved decision there is nothing to trace or enforce.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"How many fields does the decision record taught in this course hold?","o":["Five","Seven","Nine","Twelve"],"a":2,"e":"Decision ID, conflicting requirements, stakeholders involved, alternatives considered, final decision, rationale and trade-offs, risks and conditions, approval and status, traceability.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"Which decision-record field explains why the solution was selected and what was sacrificed?","o":["Decision ID","Rationale and trade-offs","Stakeholders involved","Traceability"],"a":1,"e":"Rationale gives the reason, and the trade-off names what was given up.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"What does the “Traceability” field of a decision record contain?","o":["Links to the updated requirements and test cases","The names and roles of everyone who attended the meeting","The cost of each alternative","The date of the next review"],"a":0,"e":"Traceability connects the decision to the artefacts it changed.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"Which field captures remaining risks, exceptions and assumptions?","o":["Alternatives considered","Final decision","Risks and conditions","Approval and status"],"a":2,"e":"It records what could still go wrong and under what conditions the decision holds.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"Why does a decision record list the alternatives considered?","o":["To show that other options were weighed, so the decision can be understood and revisited later","To make the record longer","To embarrass the stakeholders whose ideas were rejected","To replace the final decision"],"a":0,"e":"Knowing what was rejected, and why, stops the same debate being repeated.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"In DR-04, what is the decision about the examination access window?","o":["Students may access an exam only during its authorised window, from the approved start time to the deadline","Students may access an exam at any time","Students may start early if they are ready","Only staff may ever open an exam"],"a":0,"e":"It is validated by testing that access is denied before the start, granted within the window and denied after the deadline.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"What trade-off does DR-04 accept?","o":["Exam security is weakened","Students cannot begin early, even if ready before the scheduled start","Staff can no longer change the schedule","Answers are no longer saved"],"a":1,"e":"Security is preserved at the cost of some flexibility for students.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"DR-04's status is “Proposed, pending approval by the examination department”. What follows from this?","o":["It must not be presented as an approved agreement","It can be implemented immediately as the final rule","It no longer needs validation tests","It replaces R1 and R2 automatically"],"a":0,"e":"A proposed decision is not yet an agreement.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"Once DR-04 is approved, what must be updated?","o":["Only the minutes of the meeting","Only the project budget","Nothing, because the record is self-contained","The requirements specification, the interaction matrix and the related test cases"],"a":3,"e":"An approved decision changes the requirements, so everything linked to them is brought into line.","w":6,"t":"Negotiation process and decision records (Q265–Q280)"},{"q":"Which factors do social and cultural influences on requirements include?","o":["Values, language, accessibility needs, customs and working practices","Server capacity, bandwidth and storage","Programming languages and frameworks","Budget, staffing and deadlines"],"a":0,"e":"These human factors shape how people use a system; budget, staffing and deadlines are organisational influences.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"A system meets every technical specification but ignores how its users actually live and work. What is the likely outcome?","o":["It succeeds anyway, because specifications are all that matter","It becomes cheaper to maintain","It reaches a higher CMM level","It can still fail, because people cannot or will not use it"],"a":3,"e":"A technically correct system can fail if it ignores social and cultural context.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"Many users of a public-service app have limited reading ability. Which requirement responds to the language and literacy factor?","o":["Keyboard navigation and screen-reader support","Low-data use and performance on older devices","Personal results visible only to authorised users","Clear language options and instructions"],"a":3,"e":"Language and literacy call for clear wording and a choice of language.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"Which requirement responds to the accessibility factor?","o":["Keyboard navigation and screen-reader support","Clear language options and instructions","Safe alternative ways to give feedback","Documenting real workflows before standardising"],"a":0,"e":"Accessibility means people with disabilities can operate the system.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"Users with little experience of software keep making mistakes in a long form. Which requirement responds to the digital-literacy factor?","o":["Encrypting all stored data","Guided workflows and helpful error messages","Low-data use on older devices","Department-level performance rankings"],"a":1,"e":"Guidance and clear error messages support users who are new to software.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"Many students can afford only old phones and small data packages. Which requirement responds to this socioeconomic context?","o":["Screen-reader support","Clear language options","Role-based permissions","Low-data use and good performance on older devices"],"a":3,"e":"The system must work within what its users can actually afford.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"Exam slots keep clashing with some users' religious or cultural practices. What is the suggested requirement response?","o":["Ignore the clashes, because schedules are a technical matter","Remove those users from the system","Assume what each community needs and hard-code it","Consult users on scheduling constraints"],"a":3,"e":"The response is to ask the users concerned, not to assume.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"Which requirement responds to privacy expectations?","o":["Recordings of live sessions for students who miss them","Guided workflows","Personal results visible only to authorised users","Compressed video options"],"a":2,"e":"People expect their personal results to be seen only by those entitled to see them.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"Some users are reluctant to raise complaints openly because of gender or social context. Which requirement responds to this?","o":["Larger fonts on every screen","Faster page loading","A public ranking of all complaints received","Safe alternative ways to give feedback"],"a":3,"e":"A safe channel lets people speak who would otherwise stay silent.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"Before a manual process is standardised in software, what does the local working practices factor suggest?","o":["Replace all local practices with the vendor's default process","Document the real workflows first","Ask only senior management how work is done","Skip analysis, because practices will change anyway"],"a":1,"e":"Standardising without knowing how work is really done invites resistance and workarounds.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"These responses are described as “examples of possible requirements, not assumptions about any community”. What must the analyst therefore do?","o":["Apply them to every future project unchanged","Validate them with the real stakeholders","Ignore them unless a law demands them","Decide on behalf of each community"],"a":1,"e":"They are prompts for analysis; only the actual stakeholders can confirm them.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"Why is it wrong to derive requirements from stereotypes about a group?","o":["Stereotypes are assumptions; real users in the group may have different needs","Stereotypes are always too expensive to implement","Stereotypes are forbidden by CMM Level 2","Stereotypes make the interaction matrix larger"],"a":0,"e":"Social and cultural analysis means understanding user context without relying on stereotypes.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"In the mobile learning case, the initial requirements reflected:","o":["The results of careful user research","Legal obligations on the university","The designers' own assumptions","The students' stated preferences"],"a":2,"e":"The designers assumed desktop computers, fast connections and fixed schedules.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"“All material in high-resolution video” was revised to:","o":["Video removed from the course entirely","Downloadable notes and compressed video options","Video made available on campus desktop computers only","Higher-resolution video for every lesson"],"a":1,"e":"Students with limited connectivity can still reach the material.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"“Assignments submitted from a desktop computer” was revised to mobile-responsive submission. Which finding justifies the change?","o":["Desktop computers are insecure","Teachers dislike using desktop computers","Some students rely on mobile devices","Mobile apps are cheaper to build"],"a":2,"e":"Inclusive analysis showed that a phone is the only device some students have.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"What is the goal of revising the mobile learning requirements?","o":["To lower academic standards so that more students pass","To reduce the teachers' workload","To remove all live sessions","To remove barriers, not to lower academic standards"],"a":3,"e":"The learning outcomes stay the same; only the obstacles to reaching them are removed.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"“Live sessions at one fixed time” was revised to offer recordings or alternative participation. Under what condition?","o":["Whenever a student asks, for any reason","When pedagogically appropriate","Only for students who pay an extra fee","Only during the examination week"],"a":1,"e":"Alternatives are offered where they do not undermine the teaching purpose.","w":7,"t":"Social and cultural influences (Q281–Q297)"},{"q":"In requirements engineering, what does “political” mean?","o":["Related to national elections and parties","Related to government regulation only","Related to the programming team's preferences","Power, competing interests and resource negotiation inside an organisation"],"a":3,"e":"Politics here is about who holds power and competes for resources within the organisation.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"Which of these is an organisational influence on requirements?","o":["A feature pushed with little evidence of demand","Departments competing over a shared database","Policies, standard procedures and approval hierarchies","A dashboard requested mainly for visibility to management"],"a":2,"e":"Organisational influences come from structure and rules; the other three are political.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"Which of these is a political influence on requirements?","o":["Budget, staffing and deadlines","A process kept because one department controls it","Legacy systems and existing workflows in each office","Departmental duties"],"a":1,"e":"Keeping a process in order to keep control is about power, not about need.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"A university requires department-head approval before a teacher changes a grade. What does this requirement reflect?","o":["A technical limit of the database","A programming error","A cultural practice of the students and teachers","The organisation's accountability structure"],"a":3,"e":"The approval step exists because of how the organisation assigns accountability.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"When a request seems driven by organisational politics, what should the analyst do?","o":["Reject it at once, because politically driven requests are never valid","Examine it and separate the genuine need from personal preference","Accept it without question, because the requester is senior","Hide it from other stakeholders"],"a":1,"e":"Analysts separate genuine needs from personal preferences.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"Are organisational and political influences always illegitimate?","o":["Yes, they should always be removed from the requirements","Yes, because they are never written down","No, they must always be accepted as stated","No, they can be legitimate, but they must be examined"],"a":3,"e":"Some reflect real accountability or policy; each one has to be checked.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"A team resists an automation feature because it would change their role. Why does this matter for requirements?","o":["It proves the feature is technically impossible","It means the whole team should be removed from the stakeholder list before the next review","It has no effect on the project","Resistance to changed roles affects adoption, so it must be understood and addressed"],"a":3,"e":"People who feel threatened by a system can undermine it after delivery.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"A powerful manager pushes for a feature with little evidence that anyone needs it. What should the analyst ask for?","o":["The manager's job title","Evidence of demand and the underlying need","A larger budget","A promise that the feature will be popular"],"a":1,"e":"A request backed only by position still has to show a real need.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"In the performance management case, why does HR want access to individual records restricted?","o":["Visibility and accountability","Operational control","Confidentiality and compliance","Cost and technical limits"],"a":2,"e":"HR must protect personal data and meet its legal duties.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"Senior management asks for department-level performance rankings. What is the underlying influence?","o":["Fairness and transparency","Confidentiality and compliance","Visibility and accountability","Cost and technical limits"],"a":2,"e":"Management wants to see how departments perform and hold them to account.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"Employees ask to review and challenge their scores. What is the underlying influence?","o":["Operational control","Cost and technical limits","Visibility to management","Fairness and transparency"],"a":3,"e":"Employees want to know how they were judged and to correct mistakes.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"The IT department asks to reuse the existing database. What is the underlying influence?","o":["Fairness and transparency","Confidentiality and compliance","Cost and technical limits","Operational control"],"a":2,"e":"Reuse saves money and fits the technology already in place.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"In the balanced solution for performance management, what do employees get?","o":["They can view their own assessments and appeal","They can edit their own scores","They can see every colleague's score and ranking","They get no access at all"],"a":0,"e":"Viewing and appealing gives fairness without giving up control or confidentiality.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"In the same balanced solution, what does senior management receive?","o":["Full access to every individual record","The right to edit any employee's score","No reports of any kind","Restricted aggregate reports"],"a":3,"e":"Aggregate reports give visibility while individual records stay protected.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"Senior management's preference clashes with a data-protection obligation. Which statement is correct?","o":["The preference does not automatically override legal or policy obligations","Senior management always decides, whatever the law says","The law applies only to external customers","The analyst should simply choose whichever of the two is easier to implement"],"a":0,"e":"Applicable law and policy are checked first; rank does not cancel them.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"In the balanced solution, what must managers do when they change a score?","o":["Justify the change","Delete the old score permanently","Ask the IT department to approve it","Hide the change from the employee"],"a":0,"e":"Authorised managers enter scores and must justify any change.","w":7,"t":"Organizational and political influences (Q298–Q313)"},{"q":"Which set gives the four questions for adapting requirements to diverse stakeholders?","o":["Who pays? Who codes? Who tests? Who signs?","What is the budget? What is the deadline? What is the scope? What are the main risks?","Who are they? What do they need? What barriers might they face? How will we verify?","Which language? Which device? Which browser? Which network?"],"a":2,"e":"Identify the group, find its needs, find its barriers, then decide how to check the result.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"Which barriers are considered under “What barriers might they face?”","o":["Language, accessibility, devices, workflows, authority and connectivity","Salary, promotion, leave and overtime","Compilers, libraries and frameworks","Marketing, sales and branding"],"a":0,"e":"These are the things that can stop a group from using the system effectively.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"How is the question “How will we verify?” answered?","o":["By trusting that the developers have already considered every single group of users","By asking only the project sponsor after release","By defining acceptance criteria and testing with representative stakeholders","By counting the number of features delivered"],"a":2,"e":"Adapted requirements are verified with criteria and with people who represent the group.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"Which requirement is written as “measurable, not easy to use”?","o":["“At least 90% of representative first-time users shall complete course registration without assistance during usability testing.”","“Course registration shall be easy for everyone.”","“The registration page shall be intuitive and modern.”","“Students shall find registration simple.”"],"a":0,"e":"It names the users, the task and a threshold; the threshold itself is agreed for the system's context.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"The risk table for ignoring context pairs two things in each row. What are they?","o":["A factor that is easy to overlook and the consequence it tends to cause","A developer and the feature they own","A requirement and its line of code","A stakeholder and their salary grade"],"a":0,"e":"For example, ignoring accessibility is paired with users being unable to complete essential tasks.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"On what basis should role-based permissions be defined?","o":["Each user's seniority and personal preference","Whatever is quickest to code","Real job responsibilities and approved policy","The order in which users registered"],"a":2,"e":"Permissions follow what each role actually has to do and what policy allows.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"Adapting requirements means shaping the system around legitimate differences between stakeholders. What must it not do?","o":["Consider the users' devices, data costs and network connectivity","Compromise essential security, legal or business requirements","Test with representative users","Offer more than one language"],"a":1,"e":"Adaptation removes barriers but keeps the essential requirements intact.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"What is the key lesson about ignoring context?","o":["Context matters only for mobile apps","A project can meet its technical specifications and still fail to solve the users' real problem","Technical specifications always guarantee adoption","Context is the testers' responsibility"],"a":1,"e":"Meeting the specification is not the same as meeting the need.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"What is the likely consequence of excluding user groups?","o":["Low adoption and unequal access","Lower server costs","Faster delivery with no drawbacks","A higher verifiability percentage"],"a":0,"e":"Groups that were left out cannot or will not use the system.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"What is the likely consequence of ignoring established workflows?","o":["Regulatory fines","Poor performance on old devices","Resistance, workarounds and duplicated effort","Unequal access for users who have disabilities"],"a":2,"e":"People keep working the old way alongside the new system.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"What is the likely consequence of favouring powerful stakeholders unchecked?","o":["Errors caused by unclear terminology","The system becoming unusable on slow networks","Loss of saved data","Important user needs being neglected"],"a":3,"e":"The loudest voice wins and ordinary users' needs drop out.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"What is the likely consequence of ignoring privacy or legal obligations?","o":["Loss of trust and regulatory consequences","Duplicated effort among staff in every department","Faster adoption by users","Lower documentation overhead"],"a":0,"e":"Users stop trusting the system and regulators may act.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"What is the likely consequence of not consulting representative users?","o":["Costly redesign and delayed delivery","Immediate regulatory approval","A simpler interaction matrix","A shorter requirements document with no downside"],"a":0,"e":"Problems surface late, when they are expensive to fix.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"What is the likely consequence of overlooking organisational politics?","o":["Users being unable to read the text on screens","Disputes over ownership and permissions","Slow performance on older devices","Missing screen-reader support"],"a":1,"e":"Unresolved questions of who owns data and who may approve changes come back as disputes.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"Digital Campus: teachers want to correct attendance after submission, management wants it locked immediately, and students want to dispute errors. Which resolution is balanced?","o":["Lock attendance immediately and allow no corrections or disputes","Allow corrections through a controlled process with an audit trail, plus a formal student dispute mechanism","Let teachers edit attendance at any time with no record","Remove attendance tracking from the system"],"a":1,"e":"It follows the same pattern as the marks example: controlled correction, audit trail and a route for disputes.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"Why should a team keep involving each stakeholder group after the first version of the requirements is written?","o":["To increase the number of meetings held","Because the first version is always completely wrong","Needs and context change, and adapted requirements must be checked with the people they are meant to serve","So that stakeholders can write the code themselves"],"a":2,"e":"Continued involvement validates the adaptations and catches changes early.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"},{"q":"What is the central message of the lectures on negotiation and context?","o":["Requirements engineering is a purely technical activity","Requirements engineering ends once the interviews are finished","Requirements engineering is mainly about choosing tools","Requirements engineering is also about people: negotiation, communication and decision-making in real organisational and social environments"],"a":3,"e":"Requirements are shaped by people and their environments, not only by technology.","w":7,"t":"Adapting requirements and risks of ignoring context (Q314–Q330)"}]}, Q = DATA.questions, WEEKS = DATA.weeks;   // Q: [{q, o:[4], a:0-3, e, w, t}]
const PER = 50, N = Q.length, PAGES = Math.ceil(N / PER), KEY = 'sre330-v1', L = 'ABCD';
const ident = n => Array.from({length: n}, (_, i) => i);
const fresh = () => ({ page: 0, order: ident(N), opt: Q.map(() => [0,1,2,3]), ans: {}, sq: false, so: false });
let st = fresh();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.order) && s.order.length === N && s.opt && s.opt.length === N) st = Object.assign(fresh(), s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function rnd(n) {               // unbiased random int in [0, n)
  if (window.crypto && crypto.getRandomValues) { const a = new Uint32Array(1), lim = 4294967296 - (4294967296 % n); do crypto.getRandomValues(a); while (a[0] >= lim); return a[0] % n; }
  return Math.floor(Math.random() * n);
}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// answers are stored as ORIGINAL option index per ORIGINAL question index, so shuffling never changes what is correct
function paint(card, qi) {
  const q = Q[qi], pick = st.ans[qi];
  if (pick == null) return;
  const perm = st.opt[qi];
  card.querySelectorAll('.opt').forEach((b, pos) => {
    const oi = perm[pos]; b.disabled = true;
    if (oi === q.a) b.classList.add('correct');
    else if (oi === pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const v = card.querySelector('.verdict');
  if (pick === q.a) { v.className = 'verdict ok'; v.textContent = 'Correct!'; }
  else { v.className = 'verdict bad'; v.textContent = 'Wrong — correct answer is ' + L[perm.indexOf(q.a)] + '.'; }
  const w = card.querySelector('.why'); w.hidden = false; w.replaceChildren(el('b', null, 'Why: '), document.createTextNode(q.e));
}

function render() {
  $('shufQ').classList.toggle('on', st.sq); $('shufO').classList.toggle('on', st.so);
  $('mode').textContent = (st.sq || st.so) ? ('Order: ' + [st.sq && 'MCQs shuffled', st.so && 'options shuffled'].filter(Boolean).join(' · ')) : '';
  const p = st.page, start = p * PER, slice = st.order.slice(start, start + PER);
  $('title').textContent = 'Page ' + (p + 1) + ' of ' + PAGES;
  $('range').textContent = 'Questions ' + (start + 1) + '–' + (start + slice.length) + ' of ' + N;
  const list = $('list'); list.replaceChildren();
  let lastW = null, lastT = null;
  slice.forEach((qi, k) => {
    const q = Q[qi], card = el('div', 'q');
    if (!st.sq) {
      if (q.w !== lastW) { const h = el('div', 'sec'); h.append(el('small', null, 'Week ' + q.w), document.createTextNode(WEEKS[q.w])); list.append(h); lastW = q.w; lastT = null; }
      if (q.t !== lastT) { list.append(el('div', 'sub', q.t)); lastT = q.t; }
    }
    const qt = el('div', 'qt ur'); qt.append(el('span', 'qn', String(start + k + 1)), document.createTextNode(q.q));
    if (st.sq) qt.append(el('span', 'wk', 'Week ' + q.w));
    const opts = el('div', 'opts');
    st.opt[qi].forEach((oi, pos) => {
      const b = el('button', 'opt'); b.type = 'button';
      b.append(el('span', 'k', L[pos]), el('span', 't ur', q.o[oi]));
      b.addEventListener('click', () => { if (st.ans[qi] != null) return; st.ans[qi] = oi; save(); paint(card, qi); score(); });
      opts.append(b);
    });
    const why = el('div', 'why'); why.hidden = true;
    card.append(qt, opts, el('div', 'verdict'), why);
    list.append(card); paint(card, qi);
  });
  $('prev').disabled = p === 0; $('next').disabled = p === PAGES - 1;
  const nums = $('nums'); nums.replaceChildren();
  for (let i = 0; i < PAGES; i++) {
    const b = el('button', 'num' + (i === p ? ' on' : ''), String(i + 1)); b.type = 'button';
    if (i !== p && st.order.slice(i * PER, i * PER + PER).every(qi => st.ans[qi] != null)) b.classList.add('done');
    b.addEventListener('click', () => go(i)); nums.append(b);
  }
  score();
}

function score() {
  let ok = 0, bad = 0, pageOk = 0;
  const onPage = new Set(st.order.slice(st.page * PER, st.page * PER + PER));
  for (const k in st.ans) { const qi = +k, right = st.ans[k] === Q[qi].a; right ? ok++ : bad++; if (right && onPage.has(qi)) pageOk++; }
  $('sTotal').textContent = 'Score: ' + ok + ' / ' + N;
  $('sOk').textContent = '✔ ' + ok; $('sBad').textContent = '✘ ' + bad;
  $('sPage').textContent = 'This page: ' + pageOk + ' / ' + onPage.size;
  $('prog').style.width = ((ok + bad) / N * 100) + '%';
}

const top0 = () => window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
function go(p) { if (p < 0 || p >= PAGES) return; st.page = p; save(); render(); top0(); }
function restart(msg) {
  if (Object.keys(st.ans).length && !confirm(msg + '\n\nThis starts a new attempt and clears your current answers.')) return false;
  st.ans = {}; st.page = 0; return true;
}
$('shufQ').onclick = () => { if (!restart('Shuffle the order of all MCQs?')) return; st.order = shuffle(ident(N)); st.sq = true; save(); render(); top0(); };
$('shufO').onclick = () => { if (!restart('Shuffle the options of every MCQ?')) return; st.opt = Q.map(() => shuffle([0,1,2,3])); st.so = true; save(); render(); top0(); };
$('orig').onclick = () => { if (!restart('Go back to the original order (MCQs and options)?')) return; st.order = ident(N); st.opt = Q.map(() => [0,1,2,3]); st.sq = st.so = false; save(); render(); top0(); };
$('prev').onclick = () => go(st.page - 1);
$('next').onclick = () => go(st.page + 1);
$('reset').onclick = () => { if (confirm('Clear all your answers and start again?')) { st.ans = {}; st.page = 0; save(); render(); top0(); } };
render();
</script>
