<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --muted:#667085; --line:#e3e6ec;
    --accent:#2f5bea; --accent-ink:#fff; --accent-soft:#e8eefe;
    --ok:#16a34a; --ok-bg:#e8f7ee; --bad:#dc2626; --bad-bg:#fdecec;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1218; --card:#171b23; --ink:#e7eaf0; --muted:#98a2b3; --line:#2a303b;
      --accent:#5b7cfa; --accent-ink:#fff; --accent-soft:#1c2547; --ok:#22c55e; --ok-bg:#12301f; --bad:#f05252; --bad-bg:#3a1717; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui)}
  .ur{font-size:16px;line-height:1.5}
  header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(0,0,0,.04)}
  .bar{max-width:860px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{flex:1 1 220px;font-weight:700;font-size:15px;line-height:1.3}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .score{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pill{border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
  .pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
  .pill.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
  .pill.main{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:14px}
  .progress{height:4px;background:var(--line)}
  .progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  main{max-width:860px;margin:0 auto;padding:16px 16px 40px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;}
  .toolbar .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
  .tbtn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
  .tbtn:hover{border-color:var(--accent)}
  .tbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .toolbar{justify-content:space-between}
  .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .mode{font-size:12px;color:var(--muted);}
  .pagehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 0 10px;}
  .pagehead h1{font-size:20px;margin:0}
  .pagehead span{color:var(--muted);font-size:14px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px 14px;margin:10px 0}
  .q .qt{margin:0 0 8px;font-weight:600}
  .q .qn{display:inline-block;font-family:var(--ui);font-size:14px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 8px;margin-right:8px;vertical-align:1px;line-height:1.6}
  .opts{display:grid;gap:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;width:100%;cursor:pointer;color:inherit;background:transparent;
    border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;transition:background .15s,border-color .15s}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--bg)}
  .opt:disabled{cursor:default}
  .opt .k{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--ui);background:var(--bg);border:1px solid var(--line)}
  .opt .t{flex:1;overflow-wrap:anywhere}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .k{background:var(--ok);color:#fff;border-color:var(--ok)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
  .opt.dim{opacity:.6}
  .verdict{margin-top:8px;font:600 13px/1.4 var(--ui)}
  .why{margin-top:6px;font-size:14px;color:var(--ink);background:var(--bg);border-radius:8px;padding:8px 12px;border-left:3px solid var(--accent)}
  .why b{color:var(--accent)}
  .sec{margin:22px 0 10px;padding:10px 14px;border-left:4px solid var(--accent);background:var(--card);border-radius:6px;font-weight:700;font-size:15px}
  .sec small{display:block;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .sub{margin:16px 2px 4px;font-size:13px;font-weight:600;color:var(--muted)}
  .wk{display:inline-block;font:600 11px/1.6 var(--ui);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:8px;vertical-align:1px;white-space:nowrap}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 0 8px;flex-wrap:wrap;}
  .btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 18px;cursor:pointer}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn:disabled{opacity:.4;cursor:default}
  .nums{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .num{font:inherit;font-size:13px;min-width:34px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .num.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .num.done{border-color:var(--ok)}
  .tools{text-align:center;margin-top:18px;}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px;}
  @media (max-width:560px){
    .bar{padding:6px 12px;gap:6px} .brand{flex-basis:100%} .brand small{display:none}
    .pill{font-size:12px;padding:4px 9px} .pill.main{font-size:13px}
    .pager .btn{flex:1} .nums{order:3;width:100%}
  }
</style>

<script>
const DATA = {"weeks":{"1":"Requirements basics","2":"Kinds of requirements, defects and contracts","3":"RE process, user stories and requirement quality","4":"Stakeholders and process maturity (CMM)","5":"Requirements elicitation","6":"Requirements analysis and negotiation","7":"Requirements in context"},"questions":[{"q":"Which statement best describes a software requirement?","o":["A detailed description of how the source code will be organised into modules and packages","A test case that checks whether a feature works correctly","A schedule showing when each feature will be delivered","A statement of what the system must do, or a quality or constraint it must satisfy"],"a":3,"e":"A requirement states a needed capability, quality or constraint; code structure, tests and schedules are derived from it.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"A missing requirement is discovered after the system is deployed instead of during analysis. What is the most likely effect?","o":["It costs about the same, because only one statement changes","It is cheaper, because users of the live system can now describe the need exactly","It costs far more, because design, code, tests and documents must be reworked","It has no cost, because maintenance budgets cover every change"],"a":2,"e":"The later a requirements error is found, the more finished work has to be redone.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"What is the main purpose of a one-sentence vision for a system?","o":["To list every functional requirement of the whole system in strict priority order","To record the technologies the developers have chosen","To state who the system is for, what problem it solves and the main benefit","To define the acceptance tests for the first release"],"a":2,"e":"A vision gives everyone a shared, high-level picture of users, problem and value before details are written.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"Which of these is the best one-sentence vision?","o":["“The system will be built with React and MySQL.”","“A mobile app that lets university students find and book a free library seat in seconds.”","“The system shall respond to every request within 2 seconds.”","“Five developers will deliver the product by December.”"],"a":1,"e":"It names the users, the problem and the benefit; the others are a technology choice, a single quality requirement and a project plan.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"Who counts as a stakeholder of a software system?","o":["Only the people who will use its screens every day","Only the customer who pays for the development","Only the developers and testers who build it","Anyone who affects the system or is affected by it"],"a":3,"e":"Stakeholders include users, customers, developers, regulators and others with an interest in or influence over the system.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"In a hospital appointment system, which of these is a stakeholder but not a direct user?","o":["The receptionist who books appointments","The patient who checks an appointment time in the app","The doctor who views the daily schedule","The health regulator that sets patient-data rules"],"a":3,"e":"The regulator never operates the system, yet its rules create requirements the system must meet.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"Why does an analyst list several stakeholders and what each one wants before writing requirements?","o":["Different stakeholders have different needs, so missing one means missing requirements","A longer stakeholder list makes the project look more important","Every stakeholder must approve the source code before release","Each stakeholder will later write and maintain their own section of the design document"],"a":0,"e":"Requirements come from stakeholders; an overlooked stakeholder is an overlooked source of needs and conflicts.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"Which statement is a requirement rather than a design decision?","o":["“Sessions will be stored in a hash map.”","“The login page will be implemented in React.”","“Passwords will be kept in a separate, encrypted table of the main database.”","“A registered user shall be able to reset a forgotten password by email.”"],"a":3,"e":"It says what the system must let the user do; the other three say how the system will be built.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"A stakeholder says, “I want a red button that emails my manager.” What should the analyst do first?","o":["Record it exactly as stated and move on","Find the underlying need the button is meant to serve","Reject it, because stakeholders must not propose solutions","Ask the developers to estimate the button's cost"],"a":1,"e":"Stakeholders often state solutions; the real requirement is the need behind it, such as alerting a manager to urgent cases.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"A team delivers software that passes all its tests, but users say it does not help them do their work. What most likely went wrong?","o":["The programming language was a poor choice for the project","The testers did not run enough test cases","The servers were too slow for the workload","The requirements did not capture the users' real needs"],"a":3,"e":"Building the product right is not enough; poor requirements mean the wrong product gets built.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"A team member proposes a feature that does not support the agreed vision. How should the vision be used?","o":["It should be rewritten at once so the feature fits","As a scope check: question or defer features that do not serve it","It should be ignored, since a vision is only a slogan","As a guarantee that every stakeholder request will eventually be built"],"a":1,"e":"A vision keeps scope focused; requests that do not serve it need justification before they are accepted.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"The finance office wants every payment checked manually, while students want instant confirmation. What does this show?","o":["Stakeholder wants can conflict and must be analysed, not simply recorded","One of the two groups is not a real stakeholder","The student request is non-functional, so it can safely be dropped from the list","Requirements should be written only by the finance office"],"a":0,"e":"Both wants are legitimate; the analyst must surface the conflict and work towards a balanced requirement.","w":1,"t":"Requirements, vision and stakeholders (Q1–Q12)"},{"q":"A functional requirement describes:","o":["How fast the system must respond under heavy load","Which coding standard the team must follow","A service or behaviour the system must provide","The laws the organisation must comply with"],"a":2,"e":"Functional requirements say what the system does; speed, standards and laws are qualities or constraints.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"A non-functional requirement mainly describes:","o":["A feature the user can pick from a menu","The order in which features will be built","A quality or constraint on how the system delivers its functions","A function that most users consider unimportant and rarely ever use"],"a":2,"e":"Non-functional requirements cover qualities such as performance, security and reliability; they are not “less important” functions.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“The system shall generate a monthly sales report for the manager.” This is a:","o":["Functional requirement","Performance requirement","Usability requirement","Design constraint"],"a":0,"e":"Producing a report is a service the system provides.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“The dashboard shall load within 3 seconds for 95% of requests.” This is a:","o":["Functional requirement","Non-functional requirement: performance","Non-functional requirement: security","Domain requirement"],"a":1,"e":"It sets a measurable speed target, not a new function.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“All passwords shall be stored in encrypted form.” Which type of non-functional requirement is this?","o":["Reliability","Security","Portability","Usability"],"a":1,"e":"It protects data against unauthorised access.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“The system shall be operational 99.9% of the time in each calendar month.” Which quality does this specify?","o":["Usability","Maintainability","Portability","Availability"],"a":3,"e":"Availability is the proportion of time the system is up and usable.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“A new cashier shall be able to complete a sale after 30 minutes of training.” Which quality does this specify?","o":["Performance","Security","Usability","Scalability"],"a":2,"e":"It measures how easily a user learns and operates the system.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“The application shall run on Android, iOS and Windows.” Which quality does this specify?","o":["Portability","Reliability","Security","Efficiency"],"a":0,"e":"Portability is the ability to run in different environments.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“The system shall keep its response times as users grow from 1,000 to 100,000.” Which quality does this specify?","o":["Scalability","Usability","Maintainability","Security"],"a":0,"e":"Scalability is the ability to handle growth in load without losing performance.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“A developer shall be able to add a new report type in under two working days.” Which quality does this specify?","o":["Availability","Security","Maintainability","Performance"],"a":2,"e":"Maintainability is the ease of changing or extending the system.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"Why can failing a non-functional requirement be more serious than failing one functional requirement?","o":["Non-functional requirements are always easier to test","Users never notice a missing function","Non-functional requirements are always written and approved by the most senior managers","A failed quality such as security or reliability can make the whole system unusable"],"a":3,"e":"A missing function affects one task; a system that is insecure or keeps crashing fails for every task.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"Which non-functional requirement is written best?","o":["“The system shall process a payment within 5 seconds for 95% of transactions.”","“The system shall process payments quickly.”","“The system shall be user-friendly and attractive for all customers at all times.”","“The system shall be highly secure at all times.”"],"a":0,"e":"It is the only one with a measurable threshold that a test can check.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“The software shall be developed following the company's documented coding standard.” In Sommerville's classification of non-functional requirements, this is:","o":["A product requirement","An organisational requirement","An external requirement","A functional requirement"],"a":1,"e":"It comes from the policies and procedures of the developing or customer organisation.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“The system shall comply with the national data protection law.” In the same classification, this is:","o":["A product requirement","An organisational requirement","An external requirement","A usability requirement"],"a":2,"e":"External requirements come from outside the system and its organisation, such as legislation.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“The system shall let users search for books and show results within 2 seconds.” What best describes this statement?","o":["It is purely functional","It is purely non-functional","It is a design constraint","It combines a function (search) with a quality (response time)"],"a":3,"e":"Search is the function and the 2-second limit is a performance quality; they are better written as two requirements.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"Which of these is a functional requirement?","o":["“The system shall send an SMS when an order is dispatched.”","“The system shall support 500 concurrent users.”","“The system shall recover from a crash within 1 minute.”","“The interface shall follow the university's colour scheme.”"],"a":0,"e":"Sending an SMS is a behaviour; the others are capacity, recovery and look-and-feel qualities.","w":1,"t":"Functional and non-functional requirements (Q13–Q28)"},{"q":"“The system shall be fast.” Which quality characteristic does this fail most directly?","o":["Traceable","Feasible","Verifiable","Necessary"],"a":2,"e":"“Fast” has no measurable threshold, so no test can show the requirement is met.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"A requirement is unambiguous when:","o":["Every reader can interpret it in only one way","It contains no technical terms","The customer has approved it","It is shorter than one sentence of plain English"],"a":0,"e":"Ambiguity means two readers could reasonably understand the same statement differently.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"R1: “Users shall be logged out after 5 minutes of inactivity.” R2: “Users shall stay logged in until they sign out.” Which characteristic is violated?","o":["Completeness","Verifiability","Consistency","Traceability"],"a":2,"e":"The two requirements contradict each other, so both cannot be satisfied.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"“The system shall accept online payments (methods TBD).” Which characteristic does the TBD most directly threaten?","o":["Consistency","Completeness","Feasibility","Necessity"],"a":1,"e":"A TBD marks information that is still missing from the requirement.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"“The system shall answer any question in any language instantly and without error.” Which characteristic does this fail most clearly?","o":["Traceable","Feasible","Consistent","Atomic"],"a":1,"e":"It cannot be achieved within real technical, time and budget limits.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"A requirement is traceable when:","o":["It is written in the future tense","It has no spelling mistakes","It describes exactly one screen","Its origin and its links to later work products can be followed"],"a":3,"e":"A unique ID and recorded source let it be followed back to a stakeholder and forward to design and tests.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"“The system shall let users register, log in and reset passwords, and shall encrypt all data.” What is the main defect?","o":["It is infeasible","It is inconsistent","It is unnecessary","It is not atomic: several requirements are packed into one statement"],"a":3,"e":"Combined statements are hard to test, prioritise and trace individually.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"A developer adds a requirement for animated page transitions that no stakeholder asked for and no goal needs. Which characteristic does it fail?","o":["Necessary","Verifiable","Consistent","Unambiguous"],"a":0,"e":"A requirement must trace to a real stakeholder need; otherwise it is gold-plating.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"What is the purpose of auditing each requirement against quality characteristics?","o":["To decide which developer will implement it","To find defects such as ambiguity and untestable wording before design starts","To estimate how many lines of code it needs","To turn all functional requirements into non-functional ones before design begins"],"a":1,"e":"An audit catches requirement defects while they are still cheap to fix.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"Which wording is most likely to fail a verifiability audit?","o":["“within 2 seconds”","“at least 99.5% of requests”","“user-friendly”","“no more than 3 clicks”"],"a":2,"e":"“User-friendly” is a vague term with no agreed measure; the other three can be tested.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"Which is the best rewrite of “The system shall be easy to use”?","o":["“The system shall be very easy to use for everyone.”","“The system shall have a modern, attractive interface.”","“A first-time user shall complete a seat booking in under 2 minutes without help.”","“The system shall be easier to use than the old one.”"],"a":2,"e":"It names the user, the task and a measurable limit, so it can be tested.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"Which is the best rewrite of “The system shall handle many users”?","o":["“The system shall handle a large number of users.”","“The system shall handle as many users as possible.”","“The system shall handle users efficiently.”","“The system shall support 2,000 concurrent users with page loads under 3 seconds.”"],"a":3,"e":"It replaces the vague word “many” with numbers that define pass and fail.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"Why are numbers added when a vague requirement is rewritten?","o":["Numbers make the document look more technical","A number gives a clear pass or fail threshold for testing","Numbers completely remove the need to talk to stakeholders","Numbers turn a quality into a function"],"a":1,"e":"Measurable values make the requirement verifiable; the values themselves still have to be agreed with stakeholders.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"“The system shall usually respond quickly.” What is the main defect?","o":["Two vague terms, “usually” and “quickly”, with no measurable meaning","It names a technology that may change","It conflicts directly with every security requirement in the document","It describes a function instead of a quality"],"a":0,"e":"Neither word says how often or how fast, so the statement is ambiguous and untestable.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"A requirement says tax is charged at 15%, but the law the client must follow sets 18%. Which characteristic does the requirement fail?","o":["Verifiable","Atomic","Traceable","Correct"],"a":3,"e":"It is clear and testable but wrong: it does not state the real need.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"Why should requirements be ranked by importance?","o":["So low-priority requirements can be deleted later without asking anyone","So limited time and budget go to the requirements that matter most","So every requirement gets an equal share of testing","So the document can be sorted alphabetically"],"a":1,"e":"Ranking guides trade-offs and release planning when not everything can be built at once.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"Which statement is verifiable as written?","o":["“The system shall be reliable.”","“The system shall lose no saved data after a power failure.”","“The system shall be flexible enough to meet all future needs.”","“The system shall offer good performance.”"],"a":1,"e":"A test can cut the power and check the saved data; the others have no pass or fail condition.","w":1,"t":"Quality characteristics and measurable rewrites (Q29–Q45)"},{"q":"A domain requirement is one that:","o":["Any user requests during an interview","Describes the system's web address, hosting provider and server location","Comes from the rules and characteristics of the application domain","Limits which programming language may be used"],"a":2,"e":"Domain requirements reflect how the business area itself works, including its laws, standards and formulas.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"“Interest on savings accounts shall be calculated using the formula set by the central bank.” What type of requirement is this?","o":["Inverse requirement","Domain requirement","Implementation constraint","Usability requirement"],"a":1,"e":"The rule comes from the banking domain's regulator, not from a user's preference.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"Why are domain requirements often missed during elicitation?","o":["They are always too expensive to implement within a normal project budget","They apply only to the user interface","Regulators forbid writing them down","Domain experts find them so obvious that they do not state them"],"a":3,"e":"Domain knowledge is often implicit, and developers may not know enough to ask about it.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"A domain requirement can be:","o":["Only functional","Only non-functional","Either functional or non-functional","Neither, because it is a design decision"],"a":2,"e":"A domain rule may demand a function (a mandatory calculation) or a quality (a legal retention period).","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"A pharmacy system ignores the drug-dispensing rules of the health authority. What is the most likely result?","o":["The system will simply run more slowly","Only the interface will need a new colour scheme","The system may be unusable or illegal in that domain","Nothing, because domain rules are optional preferences"],"a":2,"e":"If domain requirements are not satisfied, the system may be unworkable in practice.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"Why record the rule or regulation that a domain requirement comes from?","o":["So its source can be checked and the requirement updated if the rule changes","So the developers can ignore it during design","So it can later be reclassified as an inverse requirement in the next review cycle","So it no longer needs acceptance criteria"],"a":0,"e":"Naming the source makes the requirement traceable and easy to revise when the regulation changes.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"An inverse requirement states:","o":["A requirement written in reverse priority order","A requirement the customer has rejected","What the system shall not do","What the developers shall not use during coding"],"a":2,"e":"Inverse requirements describe behaviour the system must never show.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"Which of these is an inverse requirement?","o":["“The system shall back up data every night.”","“The system shall be written in Java.”","“The system shall not display a student's marks to other students.”","“The system shall follow the tax authority's official invoice format.”"],"a":2,"e":"It states a forbidden behaviour; the others are a function, a constraint and a domain rule.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"Why are inverse requirements useful?","o":["They make clear what the system must never do, which stakeholders often find natural to state","They replace the need for functional requirements","They are never tested, so they save effort","They describe features postponed to a later release"],"a":0,"e":"People often express safety, security and privacy needs as things that must not happen.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"How is “The system shall not allow login after five failed attempts” best verified?","o":["It cannot be verified, because it describes something that does not happen","By checking that the login page loads quickly","By counting the number of registered users","By attempting the forbidden action and confirming the system blocks it"],"a":3,"e":"Inverse requirements are checked with negative tests that try to do what is forbidden.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"A design and implementation constraint is:","o":["A feature that users will see on the main screen every day","A restriction on how the system may be designed or built","A statement of what the system shall not do","A measure of how satisfied users are"],"a":1,"e":"Constraints limit the options open to designers and developers.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"Which of these is a design and implementation constraint?","o":["“The system shall let a customer cancel an order.”","“The system shall not delete audit logs.”","“The system shall answer all search queries within 2 seconds.”","“The system shall use the client's existing Oracle database.”"],"a":3,"e":"It dictates part of the solution; the others are a function, an inverse requirement and a performance quality.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"“The app must run on the hospital's existing Windows servers.” Who most plausibly imposes this constraint?","o":["The customer's IT department","The end users at the reception desk","The requirements analyst","The testing team"],"a":0,"e":"Constraints usually come from whoever owns the environment, budget or standards the system must fit.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"Why should each design constraint be justified before it is accepted?","o":["Constraints are functional requirements in disguise","A constraint removes design options, so an unnecessary one can block a better solution","Constraints never affect cost or schedule","Constraints are only suggestions that designers may ignore"],"a":1,"e":"Every constraint narrows the solution space, so it needs a real reason and a named owner.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"“The mobile app shall not run on rooted devices.” and “The mobile app shall be written in Kotlin.” These are, in order:","o":["Domain requirement; inverse requirement","Implementation constraint; domain requirement","Functional requirement; usability requirement","Inverse requirement; implementation constraint"],"a":3,"e":"The first forbids a behaviour; the second restricts how the app is built.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"A requirement exists only because a law governs the business area, not because any user asked for it. It is best classified as:","o":["A domain requirement","An inverse requirement","An implementation constraint","A usability requirement"],"a":0,"e":"Requirements that come from the laws of the application area are domain requirements.","w":2,"t":"Domain requirements, inverse requirements and constraints (Q46–Q61)"},{"q":"In requirements engineering, the customer is best described as:","o":["The person or organisation that commissions and pays for the system","Anyone who operates the system day to day","The developer who writes and later maintains the requirements document","The tester who accepts or rejects each build"],"a":0,"e":"The customer pays for the system; users are the people who operate it.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"A school buys an attendance app that teachers will operate. Who are the customer and the users?","o":["The teachers are the customer; the school is the only user","Both roles belong to the developers","The school is the customer; the teachers are the users","Students are the customer; parents are the users"],"a":2,"e":"The school commissions and pays; the teachers work with the app every day.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"From the user's point of view, a requirement is judged mainly by:","o":["How much it adds to the project budget","Whether it fits the terms of the purchasing contract","How well it helps them carry out their daily tasks","Which vendor will supply the hardware"],"a":2,"e":"Users care about getting their own work done easily and correctly.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"From the customer's point of view, a requirement is judged mainly by:","o":["The colour and layout of each screen","How few keystrokes a task needs","Which keyboard shortcuts are available","Business value, cost and compliance"],"a":3,"e":"The customer looks at what the organisation gains and what it must spend or comply with.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"Cashiers want to give refunds without approval; the store owner wants every refund approved by a manager. This is best recorded as:","o":["A conflict between the user view and the customer view","Two inverse requirements","A design constraint imposed on the system by the cashiers","A duplicate requirement"],"a":0,"e":"The users want speed and the customer wants control, so the same requirement is seen in two opposing ways.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"Why record the user view and the customer view of each requirement side by side?","o":["To prove that users' opinions carry no weight","To double the number of requirements in the document","To expose conflicts early so they can be resolved before design","To let the developers pick whichever view is easier to build and test"],"a":2,"e":"Seeing both views together shows where they disagree while changes are still cheap.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"What is the main risk of considering only the customer's view?","o":["The system will always cost far more than the budget that was first approved","The system will have too many features","Users may find the system hard to work with and avoid or work around it","The contract will become invalid"],"a":2,"e":"A system can satisfy the buyer on paper and still fail because the people using it reject it.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"What is the main risk of considering only the users' view?","o":["The interface will be too simple","The system may ignore the budget, business goals or compliance needs of those paying for it","Users will stop giving feedback","The system will have no functional requirements"],"a":1,"e":"Convenience for users has to be balanced against what the organisation can afford and must comply with.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"A freelance photographer orders a portfolio website and will maintain it personally. Which statement is correct?","o":["There is no customer at all in this project","There are no users in this project","The same person is both customer and user","The developer becomes the customer"],"a":2,"e":"Customer and user are roles; one person can hold both.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"A requirement defect is:","o":["A bug found in the code during unit testing","A feature the customer decides to postpone","A hardware failure in the production server","A flaw in a requirement, such as ambiguity, omission or contradiction"],"a":3,"e":"Requirement defects exist in the statements themselves, before any code is written.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"“The system shall support large files.” Which problem type should the defect log record?","o":["Inconsistency","Ambiguity (vague term)","Duplication","Design detail"],"a":1,"e":"“Large” has no defined size, so readers will interpret it differently.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"FR3: “Reports are exported as PDF only.” FR9: “Reports are exported as Excel only.” Which problem type is this?","o":["Omission","Inconsistency","Ambiguity","Infeasibility"],"a":1,"e":"The two statements contradict each other.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"A user requirement reads: “Customer data shall be stored in a MySQL table with 12 columns.” Which problem type is this?","o":["Omission","Duplication","Unverifiable wording with no pass or fail test","Design detail stated as a requirement"],"a":3,"e":"It prescribes how to build the solution instead of stating what is needed.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"The requirements describe placing an order but say nothing about what happens when payment fails. Which problem type is this?","o":["Ambiguity","Inconsistency","Duplication","Omission"],"a":3,"e":"A necessary case is missing, so the set of requirements is incomplete.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"In a defect log, what belongs in the “evidence” column?","o":["The name of the team member who first wrote the requirement","The reviewer's opinion of the other team","The exact words or missing item that show the problem","The number of hours spent on the review"],"a":2,"e":"Evidence points to the specific text or gap, so the authors can see and check the defect.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"Which is the most useful “suggested fix” for “The system shall respond quickly”?","o":["“Make this requirement better.”","“Delete this requirement.”","“Ask the developers what they prefer.”","“State a limit, such as responding within 2 seconds for 95% of requests.”"],"a":3,"e":"A good fix is specific and shows how the defect can be removed.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"Another team logs a defect against one of your requirements. What is the best response?","o":["Ignore it, because the original authors understand the requirement best","Delete the requirement to avoid further criticism","Check the evidence, then fix the requirement or explain why it stands","Log a defect against their requirements in return"],"a":2,"e":"A review finding is information: accept and fix it, or justify the original with reasons.","w":2,"t":"User view, customer view and requirement defects (Q62–Q78)"},{"q":"Why can a requirements document act as a contract between customer and developer?","o":["It lists the developers' salaries","It records what the developer agrees to deliver and the customer agrees to accept","It replaces all testing activities","It guarantees the project will finish early"],"a":1,"e":"Agreed requirements define the obligations of both sides.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"A contract clause says: “The supplier shall deliver a reliable system.” What is the main risk?","o":["The clause is too expensive to print","The clause prevents any testing","Each side can interpret “reliable” differently, causing disputes at acceptance","The clause forces the supplier to use one programming language for the whole system"],"a":2,"e":"A vague clause cannot be checked objectively, so acceptance becomes an argument.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"What is the role of acceptance criteria in a contract clause?","o":["They describe the internal design of the system","They give an objective test for deciding whether the clause has been met","They list all the stakeholders who attended each of the contract meetings","They set the developers' working hours"],"a":1,"e":"Acceptance criteria turn a promise into something both sides can check.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"Which clause has a proper acceptance criterion?","o":["“The system shall generate invoices properly.”","“The system shall generate invoices to the client's satisfaction.”","“The system shall generate invoices; accepted when 20 sample orders each produce a correct PDF invoice within 5 seconds.”","“The system shall generate invoices in a professional way.”"],"a":2,"e":"It names a concrete, repeatable test with a measurable pass condition.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"When requirements are used as the basis for a bid, they are kept fairly abstract. Why?","o":["Because bidders are not allowed to read details","So that different contractors can propose different ways of meeting the need","Because abstract requirements are easier to test","So that the customer can avoid paying"],"a":1,"e":"At the bidding stage the requirements must leave room for alternative solutions.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"Once the contract is awarded, why must the requirements be defined in detail?","o":["Detailed requirements completely remove the need for a separate project plan","A longer document looks more professional","Details let the developer change the price at any time","Both sides need a precise statement of what will be delivered and checked"],"a":3,"e":"The contract itself needs requirements precise enough to validate the delivered system.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"What is the purpose of a change-request clause?","o":["To forbid any change after the contract is signed","To let developers change requirements freely without telling the customer","To make every change free of charge","To define how changes are proposed, assessed, approved and recorded"],"a":3,"e":"Requirements will change, so the contract defines a controlled route for change.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"Midway through the project, the customer asks by phone for a new report. Under a proper change-request clause, what happens next?","o":["The request is written down, its impact on cost and schedule is assessed, then it is approved or rejected","The developer builds it immediately to keep the customer happy","The request is ignored because the contract is fixed","The testers decide whether the report is useful"],"a":0,"e":"A change follows the agreed process: record, assess impact, decide, then update the documents.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"Before a change request is approved, which impact should be assessed?","o":["Only the effect on the user interface","Only the developer's personal workload for the coming week","Only the effect on the marketing plan","The effect on cost, schedule and other requirements"],"a":3,"e":"A change can ripple into other requirements, the budget and the delivery date.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"What is the most likely result of accepting changes informally, with no change process?","o":["Fewer requirements for the team to implement overall","Faster acceptance testing","Lower project cost","Scope creep and disputes about what was agreed"],"a":3,"e":"Unrecorded changes expand the scope quietly and leave no agreed baseline to refer to.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"How do clear acceptance criteria protect the developer?","o":["The customer cannot reject work that demonstrably meets the agreed criteria","The developer may skip testing altogether","The developer may add features without approval","The customer must pay before any work starts"],"a":0,"e":"Objective criteria protect both sides: the customer gets what was promised and the developer gets a fair acceptance decision.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"Who should approve a change to a contracted requirement?","o":["The authority named in the change-request clause, with both parties agreeing","Any developer who thinks the change is a good idea","The newest member of the testing team","Nobody; changes take effect automatically as soon as they are requested by anyone"],"a":0,"e":"The clause names who can approve changes, so no one alters the agreement alone.","w":2,"t":"Requirements as a contract and change requests (Q79–Q90)"},{"q":"Which sequence shows the core activities of the requirements engineering process?","o":["Coding, testing, deployment, maintenance","Specification, architectural design, validation, then elicitation","Elicitation, analysis and negotiation, specification, validation","Planning, estimation, scheduling, staffing"],"a":2,"e":"Requirements are discovered, analysed and agreed, written down, then checked.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"Which activity runs alongside all the others, controlling changes to agreed requirements?","o":["Requirements elicitation","Requirements management","Requirements specification","Feasibility study"],"a":1,"e":"Requirements management handles change, versions and traceability throughout the project.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"Requirements validation mainly asks:","o":["Is the code free of syntax errors?","Is the project within budget?","Do the documented requirements describe the system the stakeholders actually need?","Has every developer been assigned a task?"],"a":2,"e":"Validation checks that the team is about to build the right system.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"In practice, the RE activities are best described as:","o":["Strictly sequential, with no return to earlier steps","Independent tasks that never share information","Iterative and interleaved, with later findings feeding back into earlier steps","Optional steps that can be skipped on large projects"],"a":2,"e":"Analysis exposes gaps that send the team back to elicitation, and validation can reopen analysis.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"A project has stable, well-understood requirements and strict regulatory documentation. Which RE process model fits best?","o":["A linear, plan-driven model with formal sign-off at each stage","An agile model with no written requirements","No process model at all, because the requirements are already known","A model that skips validation to save time"],"a":0,"e":"Stable requirements and heavy documentation needs suit a sequential model with clear sign-offs.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"A start-up's requirements change every few weeks as users react to each release. Which approach fits best?","o":["An iterative or agile process with short cycles and frequent feedback","A linear process with a single sign-off before coding","Freezing all requirements for one year","Writing the complete, signed-off specification before meeting any users"],"a":0,"e":"Volatile requirements need a process that expects change and learns from each release.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"What distinguishes a spiral model of the RE process?","o":["Each activity is performed exactly once","Requirements are never documented","The activities repeat in cycles, with the requirements refined on every turn","Validation is done only after delivery"],"a":2,"e":"Each loop of the spiral repeats elicitation, analysis, specification and validation in more detail.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"Which factor is least relevant when choosing a requirements process model?","o":["How often the requirements are expected to change","How available the customer is for feedback","How critical or regulated the system is","The colour scheme of the user interface"],"a":3,"e":"The model depends on volatility, customer access, risk and regulation, not on visual design.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"A team gives this reason for its process model: “Our client can meet us only twice during the whole project.” Which model does this reason support?","o":["A plan-driven model that gathers and agrees requirements up front","An agile model that depends on weekly feedback from the client team","A model with no elicitation activity","A model in which the client writes the code"],"a":0,"e":"Agile approaches need a customer who is continuously available; with rare access, requirements must be agreed early.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"In an RE flow table with the columns step, owner, output and quality check, why does each step need an owner?","o":["So someone can be blamed later if the client is unhappy with it","So the step can be skipped when the owner is busy","So the owner alone decides the requirements","So one named role is responsible for getting the step done"],"a":3,"e":"A step without an owner tends not to happen; ownership gives clear responsibility.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"What is the output of the elicitation step?","o":["The final signed contract","Raw requirements and notes gathered from stakeholders and other sources","The validated requirements specification","The system architecture diagram"],"a":1,"e":"Elicitation produces unrefined needs that analysis then organises and checks.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"What is the output of the specification step?","o":["A documented, organised set of requirements","A list of stakeholders to interview","A working, tested version of the full system","The acceptance test results"],"a":0,"e":"Specification writes the agreed requirements down in a clear, structured form.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"Why does each step in the RE flow have a quality check?","o":["To make the process take longer","To give every team member something to sign","To replace the validation activity at the end","To stop defects passing into the next step, where they cost more to fix"],"a":3,"e":"Checking each output early keeps errors from spreading downstream.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"Which quality check best fits the analysis and negotiation step?","o":["Counting the number of interview questions asked","Checking that the document uses the right font","Measuring page-load time on the test server","Confirming that conflicts between requirements are resolved and agreed by stakeholders"],"a":3,"e":"The purpose of this step is an agreed, conflict-free set of requirements, so that is what the check confirms.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"Which of these is an input to the RE process rather than an output?","o":["The agreed requirements","Stakeholder needs and information about existing systems","The requirements specification","System models produced by the team during requirements analysis"],"a":1,"e":"Needs, existing-system information, standards and regulations go in; agreed requirements, specifications and models come out.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"Two organisations use quite different RE processes, and both succeed. What does this show?","o":["One of them must be doing it wrong","There is no single ideal RE process; it must suit the organisation and the project","Process models make no difference to results","RE processes should be copied without changes"],"a":1,"e":"Processes vary with the organisation's culture, maturity and application domain.","w":3,"t":"RE process models and process flow (Q91–Q106)"},{"q":"What is the standard template of a user story?","o":["“The system shall [function] within [time].”","“Given [context], when [event], then [outcome].”","“[Actor] extends [use case].”","“As a [role], I want [goal], so that [benefit].”"],"a":3,"e":"A user story names who wants something, what they want and why.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"In a user story, what does the “so that” part capture?","o":["The benefit or reason behind the request","The screen layout","The test data to use","The developer who is assigned to the story"],"a":0,"e":"The benefit explains why the story matters, which guides design choices and priority.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"Which is a well-formed user story?","o":["“As a student, I want to download my transcript so that I can attach it to job applications.”","“The transcript module shall use a PDF library.”","“Transcripts.”","“As a developer, I want to refactor the whole database so that the code is cleaner and faster.”"],"a":0,"e":"It has a real user role, a goal and a user benefit; D describes technical work with no user value.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"Why does a user story name a role?","o":["To record who will write the code","To show whose need is being served, since different roles need different things","To decide the story's colour on the board","To identify who pays for the feature"],"a":1,"e":"The role keeps the requirement tied to a specific kind of user and their context.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"What are acceptance criteria for a user story?","o":["A description of the database tables and columns that the story uses","Conditions that must be true for the story to be accepted as done","The estimated hours needed to build it","A list of similar stories in other projects"],"a":1,"e":"They define “done” from the user's side and become the basis for tests.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"Which format is commonly used to write acceptance criteria?","o":["As a / I want / so that","Must / Should / Could / Won't","Given / When / Then","Strengths / Weaknesses / Opportunities / Threats"],"a":2,"e":"Given a context, when an action happens, then an observable result follows.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"Story: “As a customer, I want to reset my password so that I can regain access.” Which is the best acceptance criterion?","o":["“Password reset should work well.”","“Given a registered email, when the customer requests a reset, then a reset link valid for 30 minutes is emailed.”","“The reset feature must be secure and fast.”","“Developers will use a mail library.”"],"a":1,"e":"It states the starting condition, the action and a result that can be checked.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"In the INVEST guideline for user stories, what does the “T” stand for?","o":["Traceable","Technical","Testable","Timely"],"a":2,"e":"INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"A story reads: “As a manager, I want a complete HR system.” Which problem does it show?","o":["It has too many acceptance criteria","It is too large to estimate or test and should be split into smaller stories","It names the wrong database","It lacks a non-functional requirement"],"a":1,"e":"A story this big is an epic; it must be broken into small, testable stories.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"How do user stories differ from traditional “shall” requirements?","o":["Stories are short, user-centred prompts for conversation, with details agreed through acceptance criteria","Stories are legally binding and cannot change","Stories describe only non-functional qualities","Stories are written only after the system is delivered"],"a":0,"e":"A story is a placeholder for discussion; the acceptance criteria carry the agreed detail.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"A story has no acceptance criteria. What is the main consequence?","o":["The story cannot be given a title","The story automatically becomes a non-functional requirement","The story will be implemented faster","Nobody can objectively tell when the story is finished"],"a":3,"e":"Without criteria, “done” depends on opinion.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"Which acceptance criterion is testable?","o":["“When the cart total exceeds Rs 5,000, free delivery is applied at checkout.”","“Checkout should feel smooth.”","“Delivery charges should be reasonable.”","“The cart should work as customers expect.”"],"a":0,"e":"It has a specific condition and a specific result that either happens or does not.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"Why is the benefit clause useful when stories are prioritised?","o":["It shows how many lines of code are needed","It names the tester for the story","It fixes the delivery date","It shows the value of the story, which helps decide what to build first"],"a":3,"e":"Knowing why a story matters lets the team compare its value with other stories.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"A good set of acceptance criteria for one story should cover:","o":["The normal case and the important exception cases","Only the single case in which everything goes right","Every requirement in the whole project","The internal class design"],"a":0,"e":"Criteria should say what happens on success and when things go wrong, such as invalid input.","w":3,"t":"User stories and acceptance criteria (Q107–Q120)"},{"q":"What is a requirements register?","o":["A list of the developers assigned to the project","A structured list of requirements with attributes such as ID, priority, source and status","A log of bugs found during system testing","A calendar of stakeholder meetings"],"a":1,"e":"The register holds every requirement with the attributes needed to manage it.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"Why does each requirement need a unique ID?","o":["To show how important it is","To indicate which developer wrote it and when it was last edited","So it can be referenced, traced and changed without confusion","To sort requirements by length"],"a":2,"e":"IDs let people point to exactly one requirement in reviews, changes and tests.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"What does the “source” attribute record?","o":["The programming language used","The file where the code is stored","The test case that failed","The stakeholder, document or rule the requirement came from"],"a":3,"e":"The source is the origin of the requirement.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"Why is the source of a requirement useful later in the project?","o":["It decides the requirement's font and format","It replaces the acceptance criterion","It tells the team whom to consult when the requirement is unclear or needs to change","It proves the requirement is non-functional"],"a":2,"e":"Knowing the origin supports clarification, negotiation and change decisions.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"A register shows statuses such as proposed, approved, implemented and verified. What is the “status” attribute for?","o":["To rank requirements by their business value to the client","To track where each requirement is in its life cycle","To record who raised the requirement","To store the requirement's test data"],"a":1,"e":"Status shows progress; ranking by value is the job of priority.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"Using MoSCoW priorities, a requirement without which the release is not viable is labelled:","o":["Should have","Could have","Must have","Won't have this time"],"a":2,"e":"Must-haves are essential; the release fails without them.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"Every requirement in a register is marked “high priority”. What is the problem?","o":["Priority no longer helps decide what to build first or what to drop","The requirements become non-functional","The register can no longer hold acceptance criteria for any requirement","Nothing; this is the ideal situation"],"a":0,"e":"Priority is only useful when it separates requirements from each other.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"Why link an acceptance criterion to each requirement in the register?","o":["To make the register longer","To record the requirement's author","To define how the team will check that the requirement has been met","To show the requirement's priority"],"a":2,"e":"The criterion makes each requirement verifiable.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"A set has 20 requirements, and 15 of them have a clear pass or fail test. What is the verifiability percentage?","o":["75%","15%","60%","133%"],"a":0,"e":"Verifiable requirements divided by total requirements: 15 ÷ 20 = 75%.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"A set of 10 requirements contains 8 vague words such as “fast” and “easy”. What is the vague-word density?","o":["8 vague words per requirement","0.8 vague words per requirement","1.25 vague words per requirement","80 vague words per requirement"],"a":1,"e":"Vague words divided by number of requirements: 8 ÷ 10 = 0.8.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"Which change improves a team's quality metrics the most?","o":["Adding more requirements that contain “TBD” to the register each week","Replacing “within 2 seconds” with “quickly”","Replacing “user-friendly” with a measurable task-completion target","Removing the ID column from the register"],"a":2,"e":"It removes a vague word and makes the requirement verifiable at the same time.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"What does a high TBD count tell you about a requirements set?","o":["Many requirements are still incomplete and carry unresolved decisions","The requirements are fully verified","The team has too many stakeholders","The system will be very fast"],"a":0,"e":"Each TBD marks missing information that must be resolved before sign-off.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"Why should a team set a target for each quality metric, such as “0 TBDs before sign-off”?","o":["Targets make the metric impossible to measure","Targets are needed only for functional requirements","A target turns the measurement into a clear goal that shows whether quality is good enough","Targets remove the need to review requirements"],"a":2,"e":"A number means little alone; compared with a target, it shows whether more work is needed.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"Which wording would be counted as vague in a requirement?","o":["“500 users”","“within 3 seconds”","“PDF format”","“adequate”"],"a":3,"e":"“Adequate” has no agreed measure; the other three are specific.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"A set scores 100% verifiability and has no vague words. Can the team conclude that the requirements are correct?","o":["Yes, because metrics measure everything","Yes, because verifiable requirements are always needed","No, because these metrics show clarity, not whether the requirements reflect real stakeholder needs","No, because metrics apply only to code"],"a":2,"e":"A requirement can be perfectly testable and still be the wrong requirement; validation with stakeholders is still needed.","w":3,"t":"Requirements register and quality metrics (Q121–Q135)"},{"q":"What does the onion model of stakeholders show?","o":["The order in which the requirements will be implemented by the developers","The reporting hierarchy of the development team","The layers of the software architecture","Stakeholders arranged in rings by how closely they relate to the system"],"a":3,"e":"The system sits at the centre and stakeholders are placed in rings around it, from closest to most distant.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"In an onion map, who belongs in the innermost ring, closest to the system?","o":["People who operate or interact with the system directly","Regulators and the general public","Competitors of the organisation","Investors who fund the organisation but never see the system"],"a":0,"e":"Ring 1 holds the direct operators and users of the system.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"For a hospital appointment system, who is a ring 1 stakeholder?","o":["The national health regulator","The receptionist who books appointments in the system","A competing hospital","The shareholders of the software vendor that built the system"],"a":1,"e":"The receptionist works with the system hands-on every day.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"A department head never logs in to the system but relies on its monthly reports. Where does this stakeholder most likely sit?","o":["In a middle ring, as a beneficiary of the system's outputs","In the innermost ring, as a direct operator","Outside the map entirely, because non-users are not stakeholders","At the centre, as part of the product itself"],"a":0,"e":"Ring 2 holds people who benefit from the system without operating it.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"Which stakeholder is typical of the outermost ring?","o":["A government regulator whose rules the system must respect","The data-entry clerk who uses the system all day, every day","The support technician who maintains the system","The cashier who operates the till screen"],"a":0,"e":"Ring 3 is the wider environment: regulators, the public and other distant but relevant parties.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"Why does the onion model include outer rings at all?","o":["Outer-ring stakeholders write most of the code","Outer-ring stakeholders test every release","Stakeholders who never touch the system can still impose requirements or block it","The outer rings only make the diagram symmetrical"],"a":2,"e":"A regulator or sponsor far from the screen can still decide whether the system is acceptable.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"Moving outward from the centre of the onion, a stakeholder's relationship with the system generally becomes:","o":["More hands-on and frequent","More indirect","More technical","Irrelevant to requirements"],"a":1,"e":"Outer rings interact less directly, but their influence can still be high.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"A hacker who wants to steal customer data is best described as:","o":["A ring 1 operator","A functional beneficiary","A negative stakeholder whose goals the system must defend against","Not a stakeholder at all, so not worth considering during analysis"],"a":2,"e":"Negative stakeholders want the system to fail or be misused, and they are a source of security requirements.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"What is a stakeholder register?","o":["A list of system bugs grouped by severity","A record of developers' working hours","A table of stakeholders with their goals, influence and how the team will engage them","A diagram of the database"],"a":2,"e":"The register turns the stakeholder list into a plan for working with each one.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"In a stakeholder register, the influence rating (H/M/L) indicates:","o":["How many screens the stakeholder uses","How much power the stakeholder has to shape or block the project","How many years the stakeholder has worked in the organisation so far","How technical the stakeholder is"],"a":1,"e":"Influence is about power over decisions, funding and acceptance.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"A stakeholder has high influence over the project. Which engagement approach is most suitable?","o":["Send a newsletter once a year","Involve them closely in key decisions and reviews","Avoid contact so that they do not add more requirements","Tell them about the system only after release"],"a":1,"e":"High-influence stakeholders can stop or reshape the project, so they are engaged early and often.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"A stakeholder has low influence but will use the system every day. What should the team do?","o":["Ignore them, because their influence is low","Let them approve the budget","Remove them from the register","Still gather their needs, because daily users are a key source of requirements"],"a":3,"e":"Influence guides how you engage, not whether a stakeholder's needs count.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"Why does the register record each stakeholder's goal?","o":["To calculate their salary","To decide their seat in meetings","To understand what they want from the system, so requirements can be derived and conflicts spotted","To rank them by seniority"],"a":2,"e":"Goals are the starting point for requirements and reveal where stakeholders disagree.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"Two stakeholders in the register have goals that contradict each other. What does this signal?","o":["One of them should be deleted from the register","The register has been filled in wrongly","The stakeholder with the lower influence must be ignored","A conflict that will need analysis and negotiation"],"a":3,"e":"Conflicting goals are normal; the register makes them visible early.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"A team realises in Week 4 that it never considered the IT support staff. Which requirements are they most likely to add?","o":["Marketing slogans for the product","Maintainability needs such as error logs, backups and admin tools","The colours of the company logo","The price of the final product"],"a":1,"e":"The people who keep the system running need it to be supportable.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"Which missed stakeholder would most likely add audit-trail and data-retention requirements?","o":["A first-time end user of the app","The graphic designer","The office cleaner","An auditor or regulator"],"a":3,"e":"Oversight bodies bring compliance and accountability requirements.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"What is the main risk of discovering a stakeholder late in the project?","o":["New requirements appear late, causing rework and delay","The stakeholder will write their own code","The onion map must be redrawn in colour","The project automatically reaches a higher maturity level"],"a":0,"e":"A missed stakeholder means missed requirements, and late requirements are expensive.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"Which practice best helps a team find stakeholders it has missed?","o":["Asking only the project sponsor","Waiting for complaints after release","Limiting the list to people who attend meetings","Working ring by ring and asking who else affects or is affected by the system"],"a":3,"e":"The onion rings act as a checklist that pushes the team beyond the obvious users.","w":4,"t":"Stakeholder onion model and register (Q136–Q153)"},{"q":"What is the Capability Maturity Model (CMM)?","o":["A framework that rates how mature and disciplined an organisation's software process is","A programming language for safety-critical systems","A tool that generates code from requirements","A testing technique for user interfaces"],"a":0,"e":"CMM describes five levels of process maturity, from ad-hoc to continuously improving.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"Who created CMM, and when?","o":["The IEEE, in 1998","The SEI at Carnegie Mellon, in 1987","The ISO, in 2001","The Agile Alliance, in 2001"],"a":1,"e":"The Software Engineering Institute at Carnegie Mellon created it in 1987.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"CMM was created with the U.S. Department of Defense for what original purpose?","o":["To train new programmers","To design military hardware","To gauge the capability of software contractors","To replace project managers with automated tools"],"a":2,"e":"It gave the Department of Defense a way to judge how reliably a contractor could deliver software.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"What is the core premise behind CMM?","o":["Software fails mainly because of slow hardware","Major software project failures are usually managerial, not technical","Better programming languages and newer tools solve most project problems","Documentation should be avoided wherever possible"],"a":1,"e":"CMM improves the management process because that is where most failures start.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"A company buys a new framework to fix chronic delays caused by poor planning and uncontrolled changes. Why would CMM predict little improvement?","o":["CMM forbids the use of new technology","The root problem is the management process, which new technology does not fix","The framework was not approved by the SEI","Delays are unrelated to both process and technology"],"a":1,"e":"Planning and change control are process problems; they need process discipline, not a new tool.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"How many maturity levels does CMM define?","o":["Three","Four","Six","Five"],"a":3,"e":"The five levels are Initial, Repeatable, Defined, Managed and Optimizing.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"Which list gives the CMM levels in order from 1 to 5?","o":["Initial, Repeatable, Defined, Managed, Optimizing","Initial, Defined, Repeatable, Managed, Optimizing","Repeatable, Initial, Managed, Defined, Optimizing","Initial, Repeatable, Managed, Defined, Optimizing"],"a":0,"e":"Repeatable comes before Defined, and Defined comes before Managed.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"At Level 1 (Initial), success depends mainly on:","o":["Statistical process control","Organisation-wide standards","The heroics of individuals","Defect prevention programmes"],"a":2,"e":"Level 1 is ad-hoc and chaotic, so results depend on who happens to be on the team.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"A team delivers one project on time only because two developers worked nights; the next project fails. Which level does this describe?","o":["Level 3: Defined","Level 2: Repeatable","Level 1: Initial","Level 4: Managed"],"a":2,"e":"Success through heroics that cannot be repeated is the mark of Level 1.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"What characterises Level 2 (Repeatable)?","o":["Continuous improvement and technology innovation","Quantitative quality goals control the process","One standard process is used across the whole organisation","Basic tracking of cost, schedule and functionality"],"a":3,"e":"Level 2 adds basic project management, so earlier successes can be repeated on similar projects.","w":4,"t":"CMM and its five maturity levels (Q154–Q169)"},{"q":"What is the key difference between Level 2 and Level 3?","o":["Level 2 has discipline at project level; Level 3 has standard, documented processes across the organisation","Level 2 uses metrics; Level 3 does not","Level 2 is chaotic; Level 3 depends on heroics","Level 2 covers hardware; Level 3 covers software"],"a":0,"e":"Level 3 (Defined) standardises and documents the process for the whole organisation.","w":4,"t":"CMM and its five maturity levels (Q154–
